<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>설계사 합격 OMR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700;900&display=swap">
<style>
/* Layout: 한 장짜리 시험지 + 하단 OMR 답안지. 좁은 폭에서는 한 열로 쌓임 */
:root{
  --paper:#F2F4F7; --surface:#FFFFFF; --ink:#17202E; --muted:#5A6576; --line:#DCE1E8;
  --omr:#C7323B; --omr-soft:#F8E4E5; --ok:#1E7A4C; --ok-soft:#E0F1E7; --shade:rgba(23,32,46,.06);
  --f-display:"Noto Serif KR","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F141B; --surface:#171E28; --ink:#E7EBF0; --muted:#9AA5B3; --line:#2A3441;
  --omr:#F2676E; --omr-soft:#3A2227; --ok:#4FC38B; --ok-soft:#163428; --shade:rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F141B; --surface:#171E28; --ink:#E7EBF0; --muted:#9AA5B3; --line:#2A3441;
  --omr:#F2676E; --omr-soft:#3A2227; --ok:#4FC38B; --ok-soft:#163428; --shade:rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--omr);outline-offset:3px}
a{color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* 머리 */
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,6vw,40px);letter-spacing:-1px;line-height:1.15}
.brand h1 span{color:var(--omr)}
.brand .ed{font-size:13px;color:var(--muted)}
.lede{margin:10px 0 0;color:var(--muted);max-width:60ch}

/* 시험 종류 탭 */
.tabs{display:flex;gap:8px;margin-top:28px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:500;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab small{font-size:12px;opacity:.7}

/* 시험지 카드 */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-top:20px;box-shadow:0 1px 0 var(--shade)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:22px 24px;border-bottom:1px dashed var(--omr);flex-wrap:wrap}
.sheet-head .k{font-size:13px;color:var(--omr);font-weight:700;letter-spacing:.3px}
.sheet-head h2{font-family:var(--f-display);font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.5px}
.stamp{border:2px solid var(--omr);color:var(--omr);border-radius:4px;padding:6px 10px;font-size:13px;font-weight:700;line-height:1.3;text-align:center;transform:rotate(-3deg)}
.spec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.spec div{padding:16px 24px}
.spec div+div{border-left:1px solid var(--line)}
.spec b{display:block;font-size:15px}
.spec span{font-size:13px;color:var(--muted)}
.sheet-foot{display:flex;gap:10px;padding:20px 24px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:4px;padding:12px 20px;font-weight:700;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.red{background:var(--omr);border-color:var(--omr);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.best{margin-left:auto;font-size:13px;color:var(--muted)}
.sheet.core{border-color:var(--ink)}
.sheet.core .sheet-head{border-bottom-color:var(--line);border-bottom-style:solid}
.sheet.core .stamp{border-color:var(--ink);color:var(--ink)}
.prog{padding:18px 24px 20px;border-bottom:1px solid var(--line)}
.pg-top{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.pg-top b{font-family:var(--f-display);font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1}
.pg-top span{font-size:14px;color:var(--muted)}
.pbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
.pg-secs{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.pg-secs div{flex:1 1 0;min-width:90px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;display:grid;gap:2px}
.pg-secs span{font-size:12.5px;color:var(--muted)} .pg-secs b{font-size:15px}
.linkbtn{background:none;border:0;padding:6px 2px;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.keyline{margin:12px 0;padding:11px 14px;border-radius:4px;background:var(--paper);border-left:3px solid var(--omr);font-size:14.5px;line-height:1.55}
.keyline b{margin-right:8px;color:var(--omr);font-size:13px}
.klist{margin-top:20px;display:grid;gap:18px}
.kgroup{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 0}
.kgroup h3{font-size:16px;margin:12px 20px 6px;display:flex;justify-content:space-between;align-items:baseline}
.kgroup h3 small{font-size:12.5px;color:var(--muted);font-weight:500}
.krow{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:11px 20px;border-top:1px solid var(--line);font-size:14.5px;line-height:1.55}
.krow .no{color:var(--muted);font-size:12.5px;padding-top:2px}
.krow b{display:block;font-size:12.5px;color:var(--omr);font-weight:700;margin-bottom:2px}
.krow.done b{color:var(--ok)}
.hist{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 24px 20px;font-size:13px;color:var(--muted)}
.hist b{padding:4px 9px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--ink)}
.hist b.ok{border-color:var(--ok);color:var(--ok)} .hist b.no{border-color:var(--omr);color:var(--omr)}
.hist small{font-size:12px}
.gradnote{margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-radius:4px;font-size:14.5px;line-height:1.6;background:var(--surface)}
.bank{padding:16px 24px;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted);line-height:1.6}
.bank b{color:var(--ink)}
.lvl{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lvl>span{font-size:13.5px;font-weight:700;color:var(--muted)}
.lvl .seg{margin-top:0}
.lvl .seg button{padding:7px 14px;font-size:14px}
.lvl small{flex-basis:100%;font-size:13px;color:var(--muted);line-height:1.55}

.note{margin-top:20px;padding:18px 20px;border-left:3px solid var(--omr);background:var(--surface);border-radius:0 6px 6px 0;font-size:14.5px}
.note b{display:block;font-size:15px;margin-bottom:4px}
.note a{color:var(--omr);font-weight:500}
.soon{padding:40px 24px;text-align:center;color:var(--muted)}
.soon b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}

.wrongnote{margin-top:28px}
.wrongnote h3{font-size:17px;display:flex;justify-content:space-between;align-items:center}
.wrongnote ul{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.wrongnote li{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 16px;font-size:14.5px;display:flex;gap:10px}
.wrongnote li em{font-style:normal;color:var(--omr);font-weight:700;white-space:nowrap}

/* 문제 화면 */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.topbar .x{border:0;background:none;font-size:14px;color:var(--muted);padding:6px 0}
.topbar .pos{font-weight:700}
.topbar .timer{margin-left:auto;font-weight:700;border:1px solid var(--line);border-radius:4px;padding:4px 10px;font-size:14px}
.topbar .timer.low{color:var(--omr);border-color:var(--omr)}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:-1px}
.bar i{display:block;height:100%;background:var(--omr);transition:width .25s}

.q{margin-top:26px}
.chip{display:inline-block;font-size:12.5px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.chip.pt{border-color:var(--omr);color:var(--omr)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(19px,4.4vw,23px);line-height:1.6;margin:14px 0 0;letter-spacing:-.3px}
.qtext .n{color:var(--omr);margin-right:6px}
.opts{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:10px}
.opt{width:100%;text-align:left;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;font-size:16px;line-height:1.55;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.bub{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--omr);color:var(--omr);display:grid;place-items:center;font-size:14px;font-weight:700;font-family:var(--f-body)}
.opt.sel .bub{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--omr);background:var(--omr-soft)}
.opt.wrong .bub{background:var(--omr);border-color:var(--omr);color:#fff}

.exp{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
.exp .verdict{font-weight:700;font-size:16px}
.exp .verdict.ok{color:var(--ok)} .exp .verdict.no{color:var(--omr)}
.exp p{margin:8px 0 0;font-size:15px}
.exp .src{margin-top:10px;font-size:13px;color:var(--muted)}
.nav{display:flex;gap:10px;margin-top:22px}
.nav .btn{flex:1}

/* OMR 답안지 */
.omr{margin-top:30px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.omr h3{font-size:14px;font-weight:700;display:flex;justify-content:space-between}
.omr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:12px}
.cell{border:1px dashed var(--omr);border-radius:4px;background:transparent;padding:6px 0;font-size:13px;font-weight:700;text-align:center;color:var(--omr)}
.cell.done{background:var(--omr-soft)}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell.r{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.cell.w{border-style:solid;background:var(--omr);color:#fff}
.confirm{margin-top:16px;padding:16px;border:1px solid var(--omr);border-radius:6px;background:var(--omr-soft);font-size:15px}
.confirm .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}

/* 결과 */
.score{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:26px 24px;display:grid;grid-template-columns:auto 1fr;gap:6px 24px;align-items:end}
.score .big{font-family:var(--f-display);font-weight:900;font-size:76px;line-height:1;letter-spacing:-3px}
.score .big small{font-size:24px;letter-spacing:0;margin-left:4px;color:var(--muted)}
.pass{justify-self:start;align-self:center;font-weight:900;font-size:18px;border:3px solid currentColor;padding:6px 14px;border-radius:4px;transform:rotate(-4deg)}
.pass.ok{color:var(--ok)} .pass.no{color:var(--omr)}
.duo{display:flex;gap:12px;flex-wrap:wrap}
.duo-i{min-width:150px;padding:14px 18px 12px;border:1px solid var(--line);border-top:3px solid var(--omr);border-radius:4px;display:grid;gap:4px}
.duo-i.ok{border-top-color:var(--ok)}
.duo-i span{font-size:13.5px;font-weight:700} .duo-i span small{font-weight:400;color:var(--muted);margin-left:4px}
.duo-i b{font-family:var(--f-display);font-weight:900;font-size:46px;line-height:1;letter-spacing:-2px}
.duo-i b small{font-size:18px;letter-spacing:0;margin-left:3px;color:var(--muted)}
.duo-i em{font-style:normal;font-size:13px;color:var(--muted)}
.breakdown{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:18px;border-top:1px solid var(--line)}
.breakdown div{padding:14px 0 0}
.breakdown div+div{padding-left:16px;border-left:1px solid var(--line)}
.breakdown b{display:block;font-size:20px}
.breakdown span{font-size:13px;color:var(--muted)}
.review{margin-top:24px;display:grid;gap:12px}
.rv{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--omr);border-radius:0 6px 6px 0;padding:16px 18px}
.rv .t{font-weight:700;font-size:15.5px}
.rv .a{font-size:14.5px;margin-top:6px}
.rv .a b{color:var(--ok)}
.rv p{font-size:14.5px;margin:6px 0 0;color:var(--muted)}
.rv .rvsrc{font-size:13px;margin-top:8px}

@media (max-width:520px){
  .spec{grid-template-columns:1fr}
  .spec div+div{border-left:0;border-top:1px solid var(--line)}
  .score .big{font-size:60px}
  .score{grid-template-columns:1fr} .duo-i{flex:1 1 0;min-width:0} .duo-i b{font-size:38px}
  .breakdown{grid-template-columns:1fr}
  .breakdown div+div{border-left:0;padding-left:0;border-top:1px solid var(--line);margin-top:12px}
}

/* 핵심노트 */
.notecard{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;width:100%;text-align:left;margin-top:22px;padding:20px 22px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.notecard:hover{border-color:var(--ink)}
.notecard .nk{grid-column:1;font-size:13px;font-weight:700;color:var(--omr)}
.notecard b{grid-column:1;font-size:17px}
.notecard .muted{grid-column:1;font-size:13.5px}
.notecard .go{grid-column:2;grid-row:1/4;font-weight:700;font-size:14px;border:1px solid var(--ink);border-radius:4px;padding:8px 14px}
.nhead{margin-top:26px}
.nhead h2{font-family:var(--f-display);font-size:28px;font-weight:900;letter-spacing:-.6px}
.nhead p{margin:8px 0 0;font-size:14px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:14.5px;font-weight:500}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hint{font-size:14px;margin:16px 2px 0}
.ngroup{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 22px 10px}
.ngroup h3{font-family:var(--f-display);font-size:19px;font-weight:700;padding:16px 0 6px;border-bottom:1px dashed var(--omr)}
.ngroup dl{margin:0}
.nrow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.nrow:last-child{border-bottom:0}
.nrow dt{font-weight:700;font-size:15px}
.nrow dd{margin:0;font-size:15px;line-height:1.65;min-width:0}
.nrow.num dd b{display:block;font-weight:700}
.flag{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid}
.flag.ok{color:var(--ok);border-color:var(--ok)}
.flag.diff{color:var(--omr);border-color:var(--omr);background:var(--omr-soft)}
.dnote{display:block;margin-top:6px;font-size:13.5px;color:var(--muted)}
.traps{list-style:none;margin:0;padding:6px 0}
.traps li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.traps li:last-child{border-bottom:0}
.traps .x{color:var(--omr);text-decoration:line-through;text-decoration-thickness:1px}
.traps .o{font-weight:700}
.topl{margin:0;padding:12px 0 12px 22px;display:grid;gap:12px;font-size:15.5px}
.foot{font-size:13px;margin:22px 2px 0}
@media (max-width:520px){ .nrow{grid-template-columns:1fr;gap:6px} .traps li{grid-template-columns:1fr;gap:6px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
/* 생명보험협회 「생명보험이란 무엇인가」(2026) 내용을 바탕으로 새로 만든 예상문제. p = 교재 인쇄 쪽수 */
const QS_LIFE = [
 {s:'c1',q:'어떤 사건의 발생확률은 한두 번 관찰해서는 알기 어렵지만, 관찰 횟수를 늘리면 일정한 수치에 가까워진다. 생명보험 보험료 산출의 기초가 되는 이 원리는?',
  o:['수지상등의 원칙','급부·반대급부 균등의 원칙','대수의 법칙','보험계약자 평등의 원칙'],a:2,
  e:'관찰 횟수를 늘리면 발생확률이 일정한 값에 가까워지는 것을 대수(大數)의 법칙이라 합니다. 생명보험은 같은 성질의 위험을 가진 가입자가 많을수록 사고 발생 확률의 정확도가 높아지고 보험단체도 안정됩니다.',p:'34쪽'},
 {s:'c1',q:'계약자가 내는 보험료 총액과 보험회사가 지급하는 보험금 및 지출비용 총액이 같아지도록 보험료를 정하는 원칙은?',
  o:['수지상등의 원칙','대수의 법칙','위험분산의 원칙','실손보상의 원칙'],a:0,
  e:'수입(보험료)과 지출(보험금·비용)이 같아지도록 보험료를 정하는 것이 수지상등의 원칙입니다. 계약자 한 사람으로 보면 낸 보험료와 받는 보험금이 다를 수 있지만, 전체로 보면 같아지도록 순보험료를 계산합니다.',p:'35·40쪽'},
 {s:'c1',q:'설계사가 기존 계약과 새 계약의 중요사항을 비교해 알렸더라도, 기존 보험계약이 소멸된 날부터 (  ) 이내에 새로운 보험계약을 청약하게 하면 부당한 계약전환에 해당될 수 있다. 빈칸에 들어갈 기간은?',
  o:['2주','1개월','3개월','6개월'],a:1,
  e:'비교 안내를 했더라도 기존 계약 소멸 후 1개월 이내 새 계약 청약(또는 새 계약 청약 후 1개월 이내 기존 계약 소멸)은 부당한 계약전환이 될 수 있습니다. 다만 계약자가 손해 가능성을 알고 있음을 자필서명·녹취 등으로 증명하면 예외입니다. 피해 계약자는 기존 계약 소멸일부터 6개월 이내에 부활을 청구하고 새 계약을 취소할 수 있으며, 이는 같은 보험회사 안에서 전환된 경우에만 적용됩니다.',p:'67~68쪽'},
 {s:'c1',q:'생명보험 보험료 산출방식에 대한 설명으로 옳지 않은 것은?',
  o:['3이원방식은 예정위험률·예정이율·예정사업비율을 기초로 한다','현금흐름방식은 계약유지율·판매량·투자수익률 등 다양한 가격요소를 반영한다','현금흐름방식은 2010년 4월에 도입되었다','현금흐름방식 도입 후 현재까지 3이원방식과 선택적으로 함께 쓰고 있다'],a:3,
  e:'현금흐름방식은 2010년 4월 도입 후 3년간 3이원방식과 선택적으로 쓰였고, 2013년 4월 이후부터 본격적으로 현금흐름방식으로 보험료를 산출하고 있습니다.',p:'41쪽'},
 {s:'c1',q:'무배당보험에 대한 설명으로 옳은 것은?',
  o:['잉여금이 생기면 계약자에게 배당금을 지급한다','배당을 미리 감안해 보험료를 할인하므로 유배당보험보다 보험료가 비교적 저렴하다','모든 생명보험 상품에는 계약자배당이 발생한다','보험안내자료에 장래 배당 예상액을 자유롭게 적을 수 있다'],a:1,
  e:'무배당보험은 배당금을 주지 않는 대신 보험료 계산 때 배당을 미리 감안해 할인하므로 유배당보다 보험료가 비교적 저렴합니다. 계약자배당은 유배당 계약에만 해당하고, 보험업법 제95조는 안내자료에 장래 배당 예상을 적지 못하게 합니다(연금보험 등 예외 있음).',p:'42~43쪽'},
 {s:'c1',q:'일반금융소비자가 청약한 지 20일째 되는 날 보험증권을 받았다. 청약철회는 언제까지 할 수 있는가?',
  o:['청약일로부터 30일이 되는 날까지','보험증권을 받은 날부터 15일이 되는 날까지','청약일로부터 45일이 되는 날까지','증권을 늦게 받았으므로 철회할 수 없다'],a:0,
  e:'청약철회는 보험증권을 받은 날부터 15일 이내에 할 수 있지만, 청약일로부터 30일을 넘으면 할 수 없습니다. 20일째 증권을 받았다면 청약일로부터 30일이 되는 날까지(약 10일) 철회할 수 있습니다. 철회하면 보험회사는 3영업일 이내에 보험료를 돌려줍니다.',p:'46~47쪽'},
 {s:'c1',q:'다음 중 일반금융소비자가 청약철회를 할 수 있는 보험계약은?',
  o:['보험기간이 90일 이내인 보험','제3자의 동의가 필요한 보증보험','보험기간 20년의 일반 종신보험','계약 전에 건강상태 진단을 지원하는 보장성보험'],a:2,
  e:'보험기간 90일 이내 보험, 제3자 동의가 필요한 보증보험, 계약 전 건강진단을 지원하는 보장성보험, 법률상 가입의무가 있는 보장성보험 등은 청약철회가 불가능한 상품입니다(금융소비자보호법 시행령 제37조). 일반 종신보험은 철회할 수 있습니다.',p:'46~47쪽'},
 {s:'c1',q:'계약 전 알릴 의무 위반이 있어도 보험회사가 계약을 해지하거나 보장을 제한할 수 없는 경우에 해당하지 않는 것은?',
  o:['회사가 위반 사실을 안 날부터 1개월 이상 지났을 때','보장개시일부터 보험금 지급사유 없이 2년(진단계약의 질병은 1년)이 지났을 때','계약을 체결한 날부터 3년이 지났을 때','계약을 체결한 날부터 1년이 지났을 때'],a:3,
  e:'해지·보장 제한을 할 수 없는 기간은 ① 회사가 안 날부터 1개월 ② 보장개시일부터 지급사유 없이 2년(진단계약 질병은 1년) ③ 계약 체결일부터 3년입니다. 체결 후 1년만으로는 해당하지 않습니다. 설계사가 고지 기회를 주지 않았거나 부실 고지를 권유한 경우에도 해지할 수 없습니다.',p:'62쪽'},
 {s:'c1',q:'보험료 납입 연체로 해지되었고 해약환급금을 받지 않은 계약은, 해지된 날부터 얼마 안에 부활(효력회복)을 청약할 수 있는가?',
  o:['1년','2년','3년','5년'],a:2,
  e:'해지된 날부터 3년 이내에 부활(효력회복)을 청약할 수 있습니다. 회사가 승낙하면 연체된 보험료에 「평균공시이율 + 1%」 범위의 이자를 더해 납입합니다.',p:'66쪽'},
 {s:'c1',q:'다음 중 연성사기(Soft Fraud)에 해당하는 것은?',
  o:['경미한 상해인데도 장기간 입원해 보험금을 과다 청구하는 행위','보험금을 노리고 피보험자를 해치는 행위','방화로 보험사고를 일으키는 행위','살아 있는 사람을 사망한 것으로 위장하는 행위'],a:0,
  e:'연성사기는 우연히 생긴 사고를 과장하거나 고지의무를 위반하는 행위이고, 경성사기는 사고를 계획적으로 조작·유발하는 행위(상해·방화·살인, 사망 위장 등)입니다. 보험사기방지특별법상 보험사기는 10년 이하 징역 또는 5천만원 이하 벌금이며, 2024년 8월 14일부터 징역과 벌금을 함께 물릴 수 있습니다.',p:'110쪽'},

 {s:'c2',q:'보험업법상 보험을 모집할 수 있는 자가 아닌 것은?',
  o:['보험설계사','보험회사의 대표이사','보험대리점','보험중개사'],a:1,
  e:'모집할 수 있는 자는 보험설계사, 보험대리점, 보험중개사, 보험회사의 임원 또는 직원입니다(보험업법 제83조). 다만 임원 중 대표이사·사외이사·감사 및 감사위원은 제외됩니다.',p:'143쪽'},
 {s:'c2',q:'금융위원회로부터 생명보험설계사 등록 업무를 위탁받아 수행하는 기관은?',
  o:['금융감독원','보험개발원','한국소비자원','생명보험협회'],a:3,

 {s:'c2',q:'거짓이나 그 밖의 부정한 방법으로 보험설계사 등록을 한 자에 대한 벌칙은?',
  o:['6개월 이하의 징역 또는 500만원 이하의 벌금','1년 이하의 징역 또는 1천만원 이하의 벌금','3년 이하의 징역 또는 3천만원 이하의 벌금','5년 이하의 징역 또는 5천만원 이하의 벌금'],a:1,
  e:'부정한 방법으로 보험설계사·보험대리점·보험중개사 등록을 한 자는 1년 이하의 징역 또는 1천만원 이하의 벌금에 처합니다(보험업법 제204조 제1항 제3호).',p:'144쪽'},
 {s:'c2',q:'월 보험료 2만원인 계약을 체결한 계약자에게 계약 체결과 관련해 제공할 수 있는 금품의 최대 금액은? (보장 위험을 줄이는 물품은 아님)',
  o:['2만원','3만원','2만 4천원','4만 8천원'],a:2,

 {s:'c2',q:'금융소비자보호법상 부당권유행위에 해당하지 않는 것은?',

  e:'비교 대상·기준을 밝히지 않거나 객관적 근거 없이 다른 상품보다 유리하다고 알리는 것이 금지됩니다. 기준과 근거를 밝힌 비교 설명은 부당권유가 아닙니다(금소법 제21조).',p:'162쪽'},
 {s:'c2',q:'보험금 대리청구인 지정제도에 대한 설명으로 옳은 것은?',
  o:['계약자와 보험수익자가 달라도 지정할 수 있다','담당 보험설계사를 대리청구인으로 지정할 수 있다','4촌 이내의 친족이면 누구나 대리청구인이 될 수 있다','계약자·피보험자·보험수익자가 같은 계약이 대상이고, 대리인은 주민등록상 배우자 또는 3촌 이내 친족이어야 한다'],a:3,
  e:'중대질병·치매 등으로 본인이 청구하기 어려울 때를 대비하는 제도입니다. 분쟁 방지를 위해 계약자·피보험자·보험수익자가 같은 계약만 대상이고, 대리인은 계약자의 주민등록상 배우자 또는 3촌 이내 친족이어야 합니다.',p:'189쪽'},
 {s:'c2',q:'근로소득자가 기본공제대상자를 피보험자로 하는 일반 보장성보험에 가입한 경우의 보험료 세액공제로 옳은 것은? (지방소득세 별도)',
  o:['연 100만원 한도, 납입보험료의 12%','연 100만원 한도, 납입보험료의 15%','연 400만원 한도, 납입보험료의 12%','연 700만원 한도, 납입보험료의 15%'],a:0,
  e:'해당 연도 납입 보험료 100만원 한도로 12%를 세액공제합니다. 근로소득자만 대상이라 근로소득이 없는 연금소득자나 개인사업자는 공제받을 수 없습니다.',p:'215쪽'},
 {s:'c2',q:'일시납 등 일반 저축성보험의 보험차익이 비과세되는 요건으로 옳은 것은?',
  o:['계약기간 5년 이상, 계약자 1명당 납입보험료 합계 1억원 이하','계약기간 10년 이상, 계약자 1명당 납입보험료 합계 2억원 이하','계약기간 10년 이상, 계약자 1명당 납입보험료 합계 1억원 이하','계약기간 15년 이상, 계약자 1명당 납입보험료 합계 3억원 이하'],a:2,
  e:'최초 납입일부터 만기·중도해지일까지 10년 이상이고, 계약자 1명당 보험료 합계가 1억원 이하이면 비과세입니다. 10년 미만 단기 저축성보험의 보험차익은 이자소득으로 과세됩니다.',p:'223~224쪽'},

 {s:'c2',q:'보험설계사의 세제에 대한 설명으로 옳지 않은 것은?',

  e:'만기 전 사고로 보험가입금액의 80% 이상에 해당하는 보험금을 지급해 계약이 소멸하면 만기환급금은 지급하지 않습니다.',p:'176~177쪽'},
 {s:'nl',q:'보험업법에 따라 특별계정으로 운용되는 손해보험 상품이 아닌 것은?',
  o:['연금저축','장기손해보험','자동차보험','퇴직보험(퇴직연금)'],a:2,
  e:'특별계정으로 운용하는 손해보험 상품은 개인연금(연금저축), 퇴직보험(퇴직연금), 장기손해보험 등입니다. 퇴직보험은 2015년 12월 1일부터 신규 모집이 금지되었습니다.',p:'176~177쪽'},
 {s:'nl',q:'종합소득금액 4,500만원 이하(근로소득만 있으면 총급여 5,500만원 이하)인 사람의 연금저축 세액공제 한도와 공제율은? (지방소득세 포함)',
  o:['연 400만원 한도, 13.2%','연 600만원 한도, 16.5%','연 700만원 한도, 12%','연 900만원 한도, 15%'],a:1,
  e:'연금저축은 연 600만원까지 세액공제되며, 이 소득 구간은 16.5%입니다. 퇴직연금 부담금은 300만원까지 추가 공제됩니다. 연금저축에 붙은 특약 보험료는 보장성보험료 세액공제(연 100만원 한도) 대상입니다.',p:'198~199쪽'},
 {s:'nl',q:'연금저축보험에서 연금수령 요건을 갖춘 연금을 75세에 받을 때 적용되는 연금소득세율은? (지방소득세 제외)',
  o:['5%','3%','15%','4%'],a:3,
  e:'연금소득세율은 70세 이전 5%, 80세 이전 4%, 80세 이후 3%입니다. 연금수령 요건을 갖추지 못한 금액은 기타소득세 15%가 부과됩니다.',p:'198~199쪽'},
 {s:'nl',q:'비사업용 자동차 보유자가 자동차손해배상보장법에 따라 반드시 가입해야 하는 의무보험은?',
  o:['대인배상Ⅰ + 대물배상(2천만원 이상)','대인배상Ⅰ + 대인배상Ⅱ(1억원 이상) + 대물배상','대인배상Ⅰ만 가입하면 된다','대인배상Ⅰ + 자기차량손해'],a:0,
  e:'비사업용은 대인배상Ⅰ과 대물배상(2천만원 이상)이 의무입니다. 사업용(영업용)은 여기에 대인배상Ⅱ(1억원 이상)까지 반드시 가입해야 합니다. 미가입 시 과태료가 부과됩니다.',p:'216~217쪽'},
 {s:'nl',q:'자동차 의무보험의 특징으로 옳지 않은 것은?',
  o:['자동차 등록·검사 때 의무보험 가입 여부를 확인한다','보험회사는 특별한 사유가 없으면 계약을 거절할 수 없다','계약자는 언제든 자유롭게 해지할 수 있다','피해자는 가해자의 보험회사에 직접 보험금을 청구할 수 있다'],a:2,
  e:'의무보험은 해지가 제한됩니다. 말소등록, 중복계약, 양도, 천재지변·사고·도난 등으로 더 이상 운행할 수 없음을 증명한 경우에만 해지할 수 있습니다.',p:'216~217쪽'},
 {s:'nl',q:'자동차보험의 무보험자동차에 의한 상해 담보에서 ‘무보험자동차’에 해당하지 않는 것은?',
  o:['대인배상Ⅱ에 가입하지 않은 자동차','피보험자가 소유한 자동차','뺑소니 자동차','대인배상Ⅱ로 보상되지 않는 자동차'],a:1,
  e:'무보험자동차는 대인배상Ⅱ(공제 포함)에 가입하지 않았거나 보상되지 않는 자동차, 뺑소니 자동차 등을 말하며, 피보험자가 소유한 차량은 제외됩니다.',p:'214~215쪽'},
 {s:'nl',q:'피보험자가 피보험자동차를 소유·사용·관리하는 동안 피보험자동차 자체가 입은 손해를 보상하는 담보는?',
  o:['대물배상','자기신체사고','무보험자동차에 의한 상해','자기차량손해'],a:3,
  e:'자기차량손해(자차)입니다. 대물배상은 남의 재물에 대한 배상책임, 자기신체사고는 피보험자 본인의 사망·부상을 보상합니다.',p:'214~215쪽'},

 {s:'cm',q:'보험모집 종사자의 권한에 대한 설명으로 옳은 것은?',
  o:['보험설계사는 고객의 고지를 직접 받을 권한(고지수령권)이 있다','보험중개사는 보험회사를 대리해 계약을 체결할 수 있다','보험대리점은 계약체결권, 고지수령권, 보험료수령권을 모두 가진다','보험설계사 등록 업무는 금융감독원이 위탁받아 처리한다'],a:2,
  e:'보험대리점만 세 가지 권한을 모두 가집니다. 보험설계사와 보험중개사는 계약체결권·고지수령권·보험료수령권이 없습니다(설계사의 초회 보험료 수령권을 인정한 판례는 있음). 설계사·대리점 등록은 보험협회, 중개사 등록은 금융감독원이 위탁받아 처리합니다.',p:'8~9쪽'},
 {s:'cm',q:'보험회사를 대신해 보험회사 이름으로 고객과 계약을 체결하는 행위와, 이를 하는 모집종사자를 바르게 짝지은 것은?',
  o:['중개 – 보험설계사','대리 – 보험대리점','중개 – 보험대리점','대리 – 보험중개사'],a:1,
  e:'대리는 대리인이 본인(보험회사) 이름으로 법률행위를 하고 그 효과가 바로 본인에게 생기는 것으로, 보험대리점이 합니다. 중개는 계약을 알선하는 것으로 보험설계사·보험중개사가 합니다.',p:'8~9쪽'},
 {s:'cm',q:'교차모집 보험설계사가 소속 보험회사 외에 추가로 모집할 수 있는 상품은?',
  o:['업종이 다른 1개 보험회사의 상품','같은 업종의 다른 보험회사 2곳의 상품','업종과 관계없이 여러 보험회사의 상품','추가 모집은 할 수 없고 소속 회사 상품만'],a:0,
  e:'전속설계사는 1개 보험회사와만, 교차모집설계사는 소속 회사 외에 업종이 다른 1개 보험회사의 상품까지 계약 체결을 중개할 수 있습니다.',p:'10~11쪽'},
 {s:'cm',q:'보험업법상 보험설계사 등록 제한사유에 해당하지 않는 것은?',
  o:['파산선고를 받고 복권되지 않은 자','보험업법에 따라 등록이 취소된 후 2년이 지나지 않은 자','모집과 관련해 받은 보험료를 다른 용도로 유용한 후 3년이 지나지 않은 자','등록취소 처분을 한 번 받고 3년이 지난 자'],a:3,
  e:'등록취소 후 2년이 지나지 않은 자(2회 이상이면 최종 취소일부터 3년)가 제한 대상입니다. 한 번 취소되고 3년이 지났다면 해당하지 않습니다.',p:'10~13쪽'},
 {s:'cm',q:'손해보험의 초과보험·중복보험 규정과 보험자대위 제도는 어떤 원칙에 따라 도입되었는가?',
  o:['대수의 법칙','위험의 분담원칙','이득금지의 원칙','수지상등의 원칙'],a:2,
  e:'보험 때문에 사고 전보다 나은 상태가 되면 고의 사고를 부를 수 있어, 이를 막는 이득금지의 원칙에 따라 초과·중복보험 규정과 보험자대위가 도입되었습니다. 상해보험은 원칙적으로 적용되지 않지만 실손 치료비는 적용됩니다.',p:'42~43쪽'},
 {s:'cm',q:'보험가입금액이 보험가액보다 적은 보험의 명칭과 보상 방식을 바르게 짝지은 것은?',
  o:['초과보험 – 실손보상','일부보험 – 비례보상','중복보험 – 각 계약 전액 보상','전부보험 – 비례보상'],a:1,

 {s:'cm',q:'보험의 목적이 전부 멸실되어 보험금을 전부 지급한 보험회사가 그 목적물에 대한 권리(잔존물대위)를 취득하는 시기는?',
  o:['보험사고가 발생한 때','보험금 청구를 받은 때','손해사정이 끝난 때','보험금액을 전부 지급한 때'],a:3,
  e:'잔존물대위의 권리이전 시기는 사고 발생 때가 아니라 보험금액을 전부 지급한 때입니다. 일부보험이면 보험가액에 대한 보험금액 비율만큼 권리를 취득합니다.',p:'94~95쪽'},
 {s:'cm',q:'보험계약자·피보험자의 손해방지의무에 대한 설명으로 옳지 않은 것은?',
  o:['보험사고 후 손해가 커지지 않도록 방지·경감할 의무다','보험사고 발생 자체를 막아야 하는 의무다','게을리해 늘어난 손해는 보험회사가 보상책임을 면할 수 있다','보험계약자와 피보험자에게 있는 의무다'],a:1,
  e:'손해방지의무는 사고 발생 자체를 막는 의무가 아니라, 사고 이후 손해 확대를 막기 위한 합리적 조치를 할 의무입니다.',p:'76~77쪽'},
 {s:'cm',q:'보험회사가 위험변경·증가 통지를 받은 경우, 보험료 증액을 청구하거나 계약을 해지할 수 있는 기간은?',

 {s:'cm',q:'보험 관련 청구권의 소멸시효로 옳은 것은?',

  e:'피보험자·보험수익자의 보험금청구권과 계약자의 보험료·적립금 반환청구권은 3년, 보험회사의 보험료청구권은 2년입니다.',p:'76~77쪽'},
 {s:'cm',q:'보험회사가 청약과 함께 보험료 일부 또는 전부를 받은 뒤 정해진 기간 안에 승낙 여부를 알리지 않으면 승낙한 것으로 본다. 이 기간은?',

 {s:'cm',q:'손해보험의 청약철회에 대한 설명으로 옳지 않은 것은?',

  e:'청약철회는 가계성보험(장기손해보험은 단체상해보험 포함)에만 적용됩니다.',p:'88~89쪽'},
 {s:'cm',q:'보험회사가 약관 교부·설명의무를 위반한 경우, 보험계약자가 계약을 취소할 수 있는 기간은?',
  o:['계약 성립일부터 15일 이내','계약 성립일부터 1개월 이내','계약 성립일부터 3개월 이내','계약 성립일부터 1년 이내'],a:2,
  e:'계약 성립일부터 3개월 이내에 취소할 수 있습니다. 장기보험은 낸 보험료에 약관대출이율 이자를, 일반보험은 보험개발원 공시 정기예금이율 이자를 더해 돌려줍니다.',p:'88~89쪽'},
 {s:'cm',q:'월 보험료 5만원인 계약을 체결한 계약자에게 모집과 관련해 제공해도 특별이익에 해당하지 않는 금품의 최대 금액은?',

  e:'최초 1년간 보험료의 10%와 3만원 중 적은 금액까지는 특별이익이 아닙니다. 연 60만원의 10%는 6만원이므로 3만원이 한도입니다. 이를 어겨 금품을 제공하거나 요구해 받은 자는 3년 이하 징역 또는 3천만원 이하 벌금입니다.',p:'114~115쪽'},
 {s:'cm',q:'보험범죄의 특성에 대한 설명으로 옳지 않은 것은?',

 {id:'L08',s:'c1',q:'역선택에 대한 설명으로 옳은 것은?',o:['계약 체결 후 보험금을 노리고 위험을 키우는 것','계약 체결 전 위험이 높은 사람이 사실을 숨기고 가입하려는 것','보험회사가 우량 고객만 골라 받는 것','보험료가 오르자 계약자가 해지하는 것'],a:1,e:'역선택은 계약 체결 전의 문제이고, 체결 후 위험을 키우는 것은 도덕적 해이입니다. 언더라이팅과 부활 시 신계약 절차는 역선택을 막기 위한 장치입니다.',src:V,p:'언더라이팅'},

 {id:'L21',s:'c2',q:'연금저축과 퇴직연금을 합한 연금계좌의 연간 납입 한도는?',o:['600만원','900만원','1,200만원','1,800만원'],a:3,e:'납입 한도는 연 1,800만원이고, 세액공제 한도는 600만원(퇴직연금 합산 900만원)입니다.',src:V,p:'연금계좌 세액공제'},

 {id:'L23',s:'life',q:'보험회사가 상품을 개발할 때 작성하는 기초서류에 해당하지 않는 것은?',o:['사업방법서','보험약관','보험료 및 해약환급금 산출방법서','상품설명서'],a:3,e:'기초서류는 사업방법서, 보험약관, 보험료 및 해약환급금 산출방법서입니다. 상품설명서는 포함되지 않습니다.',src:'생명보험협회 교재(2026)',p:'259쪽'},
 {id:'L24',s:'life',q:'생명보험회사만 판매할 수 있고 요건을 갖추면 보험차익이 비과세되는 상품은?',o:['연금저축보험','연금보험','개인형퇴직연금(IRP)','연금저축펀드'],a:1,e:'연금보험은 생보사만 팔고 보험차익 비과세 혜택이 있습니다. 연금저축은 전 금융권에서 팔고 세액공제를 받습니다.',src:V,p:'연금보험'},
 {id:'L25',s:'life',q:'사용자가 정해진 부담금을 적립하면 의무가 끝나고, 운용 결과에 따라 근로자의 퇴직급여가 달라지는 퇴직연금은?',o:['확정급여형(DB)','확정기여형(DC)','퇴직일시금','단체저축보험'],a:1,e:'DC형은 사용자 부담금이 정해져 있고 급여가 운용 결과에 따라 변합니다. DB형은 근로자 급여가 정해져 있고 사용자 부담이 달라집니다.',src:V,p:'퇴직연금'},
 {id:'L26',s:'life',q:'제3보험이 보험업법상 별도 보험업종으로 편입된 연도는?',o:['1977년','1997년','2003년','2010년'],a:2,e:'제3보험(상해·질병·간병)은 2003년 보험업법 개정으로 별도 업종이 되었고, 생보사·손보사 모두 판매할 수 있습니다.',src:V,p:'제3보험의 개요'},
 {id:'L27',s:'life',q:'상해보험에서 말하는 ‘상해’의 요건으로 옳은 것은?',o:['급격·우연·외래','급격·필연·내재','점진·우연·외래','반복·우연·내재'],a:0,e:'상해는 급격하고 우연한 외래의 사고로 신체에 입은 손상입니다. 원인이 질병이면 상해로 보지 않습니다.',src:V,p:'상해보험'},
 {id:'L28',s:'life',q:'제3보험에서 보장하지 않는 원인으로 피보험자가 사망하면 회사는 어떻게 처리하는가?',o:['아무것도 지급하지 않는다','사망보험금 전액을 지급한다','계약자적립액을 지급하고 계약은 소멸한다','이미 낸 보험료 전액을 돌려준다'],a:2,e:'보장하지 않는 원인으로 사망하면 계약자적립액을 지급하고 계약은 소멸합니다. 강의에서 가장 많이 강조된 문장입니다.',src:V,p:'제3보험'},
 {id:'L29',s:'life',q:'손해보험회사가 질병사망을 특약으로 보장하려면 갖춰야 할 요건은?',o:['보험만기 80세 이하, 보험금액 개인당 2억원 이내','보험만기 90세 이하, 보험금액 개인당 3억원 이내','보험만기 100세 이하, 금액 제한 없음','주계약으로만 보장 가능'],a:0,e:'손보사의 질병사망 특약은 보험만기 80세 이하, 보험금액 개인당 2억원 이내, 만기환급금이 납입보험료를 넘지 않아야 합니다.',src:V,p:'제3보험'},
 {id:'L30',s:'life',q:'보험업법상 상품 분류에서 개인보험과 단체보험을 나누는 기준은?',o:['계약자 수','피보험자(보험 대상)가 개인인지 단체 구성원인지','보험료 납입 방식','보험기간의 길이'],a:1,e:'개인보험은 피보험자를 개인으로 한정하고, 단체보험은 일정 단체의 구성원을 피보험자로 합니다. 계약자 수가 기준이라는 보기는 함정입니다.',src:V,p:'262~263쪽'}
];
const MORE_NONLIFE = [
 {id:'N01',s:'nl',q:'화재보험에서 폭발·파열 손해까지 기본으로 보상하는 것은?',o:['주택화재보험(주택물건)','일반화재보험(일반물건)','일반화재보험(공장물건)','모든 화재보험'],a:0,e:'주택화재보험은 화재·벼락·폭발·파열을, 일반화재보험(일반·공장물건)은 화재·벼락을 보상합니다.',p:'142~143쪽'},
 {id:'N02',s:'nl',q:'80% Co-Insurance가 적용되지 않는 물건은?',o:['단독주택','아파트','사무실 건물(일반물건)','공장물건'],a:3,e:'80% Co-Insurance는 주택물건과 일반물건에만 적용되고 공장물건에는 적용되지 않습니다.',p:'144~145쪽'},
 {id:'N03',s:'nl',q:'일반화재보험의 보험금 지급기일은?',o:['지급 결정 후 3일 이내','지급 결정 후 7일 이내','지급 결정 후 14일 이내','지급 결정 후 30일 이내'],a:1,e:'화재보험은 보험금 지급이 결정된 뒤 7일 이내에 지급합니다. 3일과 바꿔 내는 함정이 자주 나옵니다.',p:'148~149쪽'},
 {id:'N04',s:'nl',q:'화재보험 계약 후 보험회사에 알려야 하는 사항이 아닌 것은?',o:['건물을 30일 이상 비워 두는 경우','다른 보험회사와 중복계약을 맺는 경우','보험의 목적을 양도하는 경우','건물을 3일간 비워 두는 경우'],a:3,e:'30일 이상 비우거나 휴업할 때, 15일 이상 개축할 때, 중복계약·양도·직업 변경 등은 알려야 합니다.',p:'76~77쪽, 148~149쪽'},
 {id:'N05',s:'nl',q:'도난보험에서 보상하지 않는 손해는?',o:['강도로 인한 도난 손해','절도범이 침입해 생긴 훼손 손해','보관장소를 72시간 이상 비워 둔 동안 생긴 도난 손해','보관장소 안에서 생긴 절도 손해'],a:2,e:'72시간 이상 비워 둔 동안의 도난, 고의·중과실, 사기·횡령, 분실, 화재·폭발 때의 도난, 30일 안에 발견하지 못한 손해는 보상하지 않습니다.',p:'162~163쪽'},
 {id:'N06',s:'nl',q:'해외여행보험에서 보험증권에 시각이 적혀 있을 때 기준이 되는 시간은?',o:['피보험자 거주지 표준시','사고 발생 국가의 현지 시각','보험증권 발행지의 표준시','출국 공항의 현지 시각'],a:2,e:'증권에 적힌 시각은 보험증권 발행지의 표준시를 따릅니다.',p:'168~169쪽'},
 {id:'N07',s:'nl',q:'장기손해보험에서 특별계정으로 운용하는 보험료는?',o:['위험보험료','부가보험료','저축(적립)보험료','영업보험료 전체'],a:2,e:'장기손해보험은 저축보험료만 특별계정으로 운용합니다. 위험보험료와 부가보험료는 포함되지 않습니다.',p:'176~177쪽'},
 {id:'N08',s:'nl',q:'장기손해보험 중 저축성보험의 보험기간 구성으로 옳은 것은?',o:['5년 이내 위주','15년 이내 위주','20년 이상만 가능','100세 만기만 가능'],a:1,e:'저축성은 보험기간 15년 이내 상품 위주로 구성되고, 보장성은 100세 만기처럼 장기 보장이 가능합니다.',p:'176~177쪽'},
 {id:'N09',s:'nl',q:'연금저축보험의 세제 혜택에 대한 설명으로 옳지 않은 것은?',o:['납입 보험료에 대해 세액공제를 받는다','세액공제 한도는 연 600만원이다','퇴직연금과 합산하면 연 900만원까지 공제된다','납입 보험료는 소득공제 대상이다'],a:3,e:'연금저축은 소득공제가 아니라 세액공제입니다. 특약 보험료는 보장성보험료 세액공제(연 100만원) 대상입니다.',p:'198~199쪽'},
 {id:'N10',s:'nl',q:'연금계좌에서 받는 연금이 연 1,500만원을 넘는 경우 과세 방법은?',o:['무조건 종합과세','무조건 16.5% 분리과세','종합과세와 16.5% 분리과세 중 선택','비과세'],a:2,e:'1,500만원 이하는 5.5~3.3% 분리과세로 끝낼 수 있고, 넘으면 다른 소득과 합산한 종합과세와 16.5% 분리과세 중 고를 수 있습니다.',p:'198~199쪽'},
 {id:'N11',s:'nl',q:'자동차보험 대인배상Ⅰ의 사망 보상한도로 옳은 것은?',o:['최고 1억원, 최저 1,000만원','최고 1억 5,000만원, 최저 2,000만원','최고 2억원, 최저 3,000만원','한도 없음'],a:1,e:'대인배상Ⅰ은 사망 최고 1억 5천만원(최저 2천만원), 부상 1급 3천만원(14급 50만원), 후유장애 1급 1억 5천만원(14급 1천만원)입니다.',p:'216~217쪽'},
 {id:'N12',s:'nl',q:'대인배상Ⅱ에서 65세 이상 피해자가 사망했을 때 위자료는?',o:['3,000만원','5,000만원','8,000만원','1억원'],a:1,e:'사망 위자료는 65세 미만 8,000만원, 65세 이상 5,000만원이고, 장례비는 500만원 정액입니다.',p:'230~231쪽'},
 {id:'N13',s:'nl',q:'자동차보험 부상 보상에서 휴업손해를 계산하는 방법은?',o:['수입감소액 × 50%','수입감소액 × 85%','수입감소액 전액','일당 정액'],a:1,e:'휴업손해는 수입감소액의 85%를 보상합니다.',p:'248~249쪽'},
 {id:'N14',s:'nl',q:'대물배상에서 피해 차량 수리비(열처리 도장료 포함)의 지급 한도는?',o:['사고 직전 가액의 100%','사고 직전 가액의 120%','사고 직전 가액의 150%','한도 없음'],a:1,e:'수리비와 열처리 도장료 합계는 사고 직전 가액의 120% 한도이고, 일부 차량은 130%까지입니다.',p:'232~233쪽'},
 {id:'N15',s:'nl',q:'피보험자동차를 양도했을 때 의무보험(대인배상Ⅰ·대물배상 의무금액)이 양수인에게 승계된 것으로 보는 기간은?',o:['양도일부터 7일째 24시까지','양도일부터 15일째 24시까지','양도일부터 30일째 24시까지','승계되지 않는다'],a:1,e:'다른 담보는 자동승계되지 않지만, 의무보험 부분은 양도일부터 15일째 되는 날 24시까지 양수인에게 승계된 것으로 봅니다.',p:'218~219쪽'},
 {id:'N16',s:'nl',q:'가족운전자 한정특약에서 ‘가족’에 해당하지 않는 사람은?',o:['기명피보험자의 배우자','기명피보험자의 며느리','기명피보험자 배우자의 부모','기명피보험자의 형제'],a:3,e:'가족은 기명피보험자의 부모·배우자·자녀·며느리·사위와 배우자의 부모입니다. 형제자매·조부모·손자녀는 포함되지 않습니다.',p:'228~229쪽, 248~249쪽'},
 {id:'N17',s:'nl',q:'대물배상에서 자동차 시세하락 손해를 보상하는 조건으로 옳은 것은?',o:['출고 후 10년 이하, 수리비가 차량가액의 10% 초과','출고 후 5년 이하, 수리비가 사고 전 가액의 20% 초과','모든 차량, 수리비와 관계없이','출고 후 1년 이하만'],a:1,e:'출고 후 5년 이하 차량이고 수리비가 사고 전 가액의 20%를 넘을 때 보상합니다.',p:'232~233쪽'},
 {id:'N18',s:'nl',q:'화재보험의 잔존물제거비용에 포함되지 않는 것은?',o:['사고현장 잔존물의 해체 비용','청소 비용','상차 비용','오염물질 제거 비용'],a:3,e:'잔존물제거비용은 해체·청소·상차 비용이며, 오염물질 제거와 폐기물 처리비용은 제외됩니다. 손해액의 10% 한도로 보상합니다.',p:'142~143쪽'},
 {id:'N20',s:'cm',q:'자기계약 대리점으로 보아 등록이 제한되는 기준은?',o:['자기·고용주 관련 보험료가 모집 보험료 누계의 30% 초과','50% 초과','70% 초과','80% 초과'],a:1,e:'자기 또는 자기를 고용한 자를 계약자·피보험자로 하는 보험료 누계가 모집 보험료 누계의 50%를 넘으면 자기계약 대리점입니다. 이를 위반한 보험대리점·보험중개사는 등록이 취소됩니다.',p:'18~19쪽, 116~117쪽'},
 {id:'N21',s:'cm',q:'보험 판매 과정 중 고객 정보수집 단계에서 파악하는 5대 필요자금이 아닌 것은?',o:['생활비','주택구입비','긴급예비자금','장례비'],a:3,e:'5대 필요자금은 생활비, 양육비(교육·결혼자금), 주택구입비, 노후자금, 긴급예비자금입니다.',p:'28~29쪽'},
 {id:'N22',s:'cm',q:'만 15세 미만자를 피보험자로 하는 계약에 대한 설명으로 옳은 것은?',o:['사망보험의 피보험자가 될 수 없다','부모가 동의하면 사망보험 피보험자가 될 수 있다','상해보험 가입도 금지된다','모든 보험 가입이 금지된다'],a:0,e:'15세 미만자·심신상실자·심신박약자는 사망보험의 피보험자가 될 수 없습니다(심신박약자가 직접 계약하거나 단체보험 피보험자인 경우는 예외).',p:'74~75쪽'},
 {id:'N23',s:'cm',q:'보험계약자 등이 고의·중과실로 위험을 현저히 변경·증가시킨 경우(위험유지의무 위반) 보험회사가 할 수 있는 조치는?',o:['안 날부터 1개월 이내 보험료 증액 청구 또는 해지','계약을 처음부터 무효로 처리','안 날부터 1년 이내 해지','아무 조치도 할 수 없다'],a:0,e:'보험회사는 그 사실을 안 날부터 1개월 이내에 보험료 증액을 청구하거나 계약을 해지할 수 있습니다.',p:'76~77쪽'},
 {id:'N24',s:'cm',q:'보험계약자의 보험료·계약자적립금 반환청구권의 소멸시효는?',o:['1년','2년','3년','5년'],a:2,e:'보험금청구권과 보험료·적립금 반환청구권은 3년, 보험회사의 보험료청구권만 2년입니다. ‘보험료 반환’을 2년으로 착각하기 쉽습니다.',p:'76~77쪽'},
 {id:'N25',s:'cm',q:'고객에게서 보험료를 직접 받을 수 있는 권한(보험료수령권)을 가진 모집종사자는?',o:['보험설계사','보험대리점','보험중개사','모두 없음'],a:1,e:'계약체결권·고지수령권·보험료수령권은 보험대리점만 가집니다(설계사의 초회 보험료 수령권을 인정한 판례는 있음).',p:'8~9쪽'},
 {id:'N26',s:'cm',q:'보험사기방지특별법상 ‘보험사기행위’의 정의로 옳은 것은?',o:['보험료를 늦게 내는 행위','보험사고의 발생·원인·내용에 관해 보험자를 속여 보험금을 청구하는 행위','보험계약을 중도에 해지하는 행위','여러 보험에 중복 가입하는 행위'],a:1,e:'보험사기행위는 보험사고의 발생, 원인 또는 내용에 관해 보험자를 기망해 보험금을 청구하는 행위입니다.',p:'56~57쪽'},
 {id:'N27',s:'cm',q:'보험의 목적에 대한 보험자대위(잔존물대위)와 제3자에 대한 보험자대위(청구권대위)의 차이로 옳은 것은?',o:['잔존물대위는 보험금 일부만 지급해도 인정된다','청구권대위는 보험금을 전부 지급해야만 인정된다','잔존물대위는 전부 멸실·전부 지급, 청구권대위는 지급한 범위 안에서 인정된다','두 제도 모두 인보험에도 원칙적으로 적용된다'],a:2,e:'잔존물대위는 목적물이 전부 멸실되고 보험금을 전부 지급해야 인정되고, 청구권대위는 일부만 지급해도 그 범위 안에서 인정됩니다. 인보험은 원칙적으로 보험자대위가 인정되지 않습니다.',p:'94~95쪽'}
];
const pick4 = (correct, cands) => { const seen=new Set([correct]); const out=[correct]; for(const c of cands){ if(out.length===4) break; if(!seen.has(c)){ seen.add(c); out.push(c);} } let k=1; while(out.length<4){ const c=correct+' 외 '+(k++); if(!seen.has(c)){seen.add(c);out.push(c);} } return out; };
const won = n => { n=Math.round(n); if(n>=100000000){ const e=Math.floor(n/100000000), r=Math.round((n%100000000)/10000); return e+'억'+(r?' '+r.toLocaleString()+'만':'')+'원'; } if(n%10000===0) return (n/10000).toLocaleString()+'만원'; if(n>10000) return Math.floor(n/10000).toLocaleString()+'만 '+(n%10000).toLocaleString()+'원'; return n.toLocaleString()+'원'; };
const R = arr => arr[Math.floor(Math.random()*arr.length)];
const GEN_LIFE = [
 {id:'G-L-WD',s:'c1',label:'청약철회 가능 기한 계산',gen(){ const d=R([3,5,8,10,12,14,16,18,20,22,25]); const ans=Math.min(d+15,30); const o=pick4(`청약일로부터 ${ans}일째 되는 날까지`,[`청약일로부터 ${d+15===ans?30:d+15}일째 되는 날까지`,`청약일로부터 ${d+30}일째 되는 날까지`,`청약일로부터 15일째 되는 날까지`,`청약일로부터 ${d+10}일째 되는 날까지`]);
   return {q:`일반금융소비자가 청약한 지 ${d}일째 되는 날 보험증권을 받았다. 청약철회는 언제까지 할 수 있는가?`,o,a:0,e:`증권을 받은 날부터 15일 이내(청약 후 ${d+15}일째)에 철회할 수 있지만, 청약일로부터 30일을 넘을 수 없습니다. 따라서 청약일로부터 ${ans}일째 되는 날까지입니다.`,src:'생명보험협회 교재(2026)',p:'46~47쪽'}; }},
 {id:'G-L-GIFT',s:'c2',label:'특별이익 한도 계산',gen(){ const m=R([10000,15000,20000,25000,30000,40000,50000,60000]); const yr=m*12, ten=yr/10, ans=Math.min(ten,30000);
   const o=pick4(won(ans),[won(ten===ans?30000:ten),won(m),won(yr/5),won(ans/2)]);
   return {q:`월 보험료 ${won(m)}인 계약을 체결한 계약자에게 모집과 관련해 제공해도 특별이익이 아닌 금품의 최대 금액은? (보장 위험을 줄이는 물품은 아님)`,o,a:0,e:`최초 1년간 보험료(${won(yr)})의 10%인 ${won(ten)}과 3만원 중 적은 금액인 ${won(ans)}까지 가능합니다.`,src:'생명보험협회 교재(2026)',p:'163쪽'}; }}
];
const GEN_NONLIFE = [
 {id:'G-N-CO',s:'nl',label:'80% Co-Insurance 보험금 계산',gen(){ const V=R([100,150,200,250,300,400,500])*1000000; const ratio=R([0.8,0.9,1.0]); const S=V*ratio; const L=R([0.1,0.2,0.25,0.3,0.4])*V; const kind=R(['주택','일반물건(사무실) 건물']);
   const o=pick4(won(L),[won(Math.round(L*S/V)),won(S),won(Math.round(L*0.8)),won(Math.round(L*0.9))]);
   return {q:`보험가액 ${won(V)}인 ${kind}에 보험가입금액 ${won(S)}으로 화재보험에 가입했다. 화재로 ${won(L)}의 손해가 났다면 지급되는 보험금은? (다른 조건은 없음)`,o,a:0,e:`가입금액이 보험가액의 ${Math.round(ratio*100)}%로 80% 이상이므로 비례보상하지 않고 가입금액 한도 안에서 손해액 전액(${won(L)})을 지급합니다.`,p:'144~145쪽'}; }},
 {id:'G-N-DEB',s:'nl',label:'잔존물제거비용 계산',gen(){ const X=R([2000,3000,4000,5000,6000,8000,10000])*10000; const rate=R([0.05,0.08,0.12,0.15,0.2]); const Y=Math.round(X*rate/100000)*100000; const ans=Math.min(Y,X/10);
   const o=pick4(won(ans),[won(Y===ans?X/10+1000000:Y),won(X/10/2),won(X/5),won(Y*2)]);
   return {q:`화재로 건물에 ${won(X)}의 재산손해가 났고, 잔존물제거비용으로 ${won(Y)}을 썼다. 잔존물제거비용으로 보상받는 금액은? (보험가입금액은 충분함)`,o,a:0,e:`잔존물제거비용은 손해액의 10%(${won(X/10)})을 한도로 보상하므로 실제 쓴 ${won(Y)}과 비교해 ${won(ans)}을 받습니다.`,p:'142~143쪽'}; }},
 {id:'G-N-AGE',s:'nl',label:'연금소득세율(나이별)',gen(){ const age=R([60,63,66,69,72,75,78,81,85,88]); const r=age<70?'5%':age<80?'4%':'3%';

 {id:'G-N-GIFT',s:'cm',label:'특별이익 한도 계산',gen(){ const m=R([10000,15000,20000,25000,30000,40000,50000]); const yr=m*12, ten=yr/10, ans=Math.min(ten,30000);

 {id:'G-N-PART',s:'nl',label:'공장물건 비례보상 계산',gen(){ const V=R([1,1.5,2,3,4,5])*100000000; const r=R([0.4,0.5,0.6,0.7,0.75]); const S=V*r; const L=R([0.1,0.2,0.3,0.4])*V; const ans=Math.round(L*r);
   const o=pick4(won(ans),[won(L),won(Math.round(L*r/0.8)),won(S),won(Math.round(ans/2))]);
   return {q:`공장물건에 보험가액 ${won(V)}, 보험가입금액 ${won(S)}으로 화재보험에 가입했다. 화재로 ${won(L)}의 재산손해가 났다면 지급보험금은? (다른 조건은 없음)`,o,a:0,e:`80% Co-Insurance는 주택물건과 일반물건에만 적용되므로 공장물건은 가입금액 비율대로 비례보상합니다. ${won(L)} × (${won(S)} ÷ ${won(V)}) = ${won(ans)}이고, 80%로 나눠 계산한 금액은 함정입니다.`,p:'144~145쪽'}; }},
 {id:'G-N-HYU',s:'nl',fam:'F-HYU',label:'휴업손해 계산',gen(){ const X=R([100,200,300,400,600,800,1000])*10000; const ans=X*0.85;
   const o=pick4(won(ans),[won(X),won(X*0.8),won(X*0.5),won(X*0.7)]);
   return {q:`자동차사고로 다친 피해자의 휴업기간 중 수입감소액이 ${won(X)}이다. 대인배상에서 보상하는 휴업손해는?`,o,a:0,e:`휴업손해는 수입감소액의 85%를 보상합니다. ${won(X)} × 85% = ${won(ans)}입니다.`,p:'248~249쪽'}; }},
 {id:'G-N-SISE',s:'nl',fam:'F-SISE',label:'자동차 시세하락손해 계산',gen(){ const V=R([2000,2500,3000,4000,5000])*10000; const age=R([['출고 후 8개월',0.2],['출고 후 1년 6개월',0.15],['출고 후 3년',0.1],['출고 후 4년 6개월',0.1],['출고 후 6년',0]]);
   const big=Math.random()<0.8; const rep=Math.round(V*(big?R([0.25,0.3,0.4,0.5]):R([0.1,0.15]))/100000)*100000;
   const ok=big&&age[1]>0; const ans=ok?won(Math.round(rep*age[1])):'보상하지 않는다';
   const o=pick4(ans,[won(Math.round(rep*0.2)),won(Math.round(rep*0.15)),won(Math.round(rep*0.1)),'보상하지 않는다']);
   const why=!big?`수리비가 사고 전 가액의 20%를 넘지 않으므로 보상하지 않습니다.`:age[1]===0?`출고 후 5년이 넘은 차량이라 보상하지 않습니다.`:`출고 후 ${age[1]===0.2?'1년 이하':age[1]===0.15?'1년 초과 2년 이하':'2년 초과 5년 이하'}이므로 수리비의 ${age[1]*100}%인 ${ans}을 보상합니다.`;
   return {q:`${age[0]} 된 차량(사고 전 가액 ${won(V)})이 대물사고를 당해 수리비로 ${won(rep)}이 나왔다. 대물배상에서 보상하는 자동차시세하락손해는?`,o,a:0,e:`시세하락손해는 출고 후 5년 이하 차량의 수리비가 사고 전 가액의 20%를 넘을 때 1년 이하 20%, 1~2년 15%, 2~5년 10%를 보상합니다. ${why}`,p:'232~233쪽, 248~249쪽'}; }},
 {id:'G-N-REPAIR',s:'nl',fam:'F-REPAIR',label:'대물 수리비 한도 계산',gen(){ const V=R([500,800,1000,1500,2000])*10000; const rep=V*R([0.6,0.9,1.1,1.3,1.5]); const ans=Math.min(rep,V*1.2);
   const o=pick4(won(ans),[won(rep),won(V),won(V*1.3),won(V*1.5),won(V*1.1)]);
   return {q:`사고 직전 가액이 ${won(V)}인 피해 차량의 수리비(열처리 도장료 포함)가 ${won(rep)}이다. 대물배상에서 지급하는 수리비는? (내용연수가 지나지 않은 일반 차량)`,o,a:0,e:`수리비와 열처리 도장료 합계는 사고 직전 가액의 120%(${won(V*1.2)}) 한도로 지급하므로 ${won(ans)}입니다. 130% 한도는 내용연수가 지난 차량 등 일부에만 적용됩니다.`,p:'232~233쪽'}; }},
 {id:'G-N-RESTORE',s:'nl',fam:'F-RESTORE',label:'자동복원 적용 여부',gen(){ const X=R([1,2,3,5])*100000000; const yes=R([0.3,0.5,0.6,0.7,0.75]); const nos=shuffle([0.8,0.85,0.9,0.95]).slice(0,3);
   const o=[`1회 사고로 ${won(X*yes)}을 지급한 경우`, ...nos.map(r=>`1회 사고로 ${won(X*r)}을 지급한 경우`)];
   return {q:`보험가입금액 ${won(X)}인 장기화재보험에서 보험금 지급 후 가입금액이 감액 없이 자동복원되는 경우는?`,o,a:0,e:`자동복원은 1회 사고로 지급한 보험금이 가입금액의 80% 미만일 때 적용됩니다. ${won(X)}의 80%는 ${won(X*0.8)}이므로 그보다 적게 지급한 경우만 복원됩니다.`,p:'178~179쪽'}; }},
 {id:'G-N-SPEC',s:'nl',fam:'F-SPEC',label:'특수건물 해당 여부',gen(){ const C=[
     [()=>`층수가 ${R([11,12,15])}층인 업무용 건물`,()=>`층수가 ${R([8,9,10])}층인 업무용 건물`],

     [()=>`바닥면적 합계가 ${R([3000,3500]).toLocaleString()}㎡인 숙박업소`,()=>`바닥면적 합계가 ${R([2000,2500,2900]).toLocaleString()}㎡인 숙박업소`],

": "유아교육기관종합보험에 대한 설명으로 틀린 것은?", "o": ["주된 피보험자는 등록된 유아원생이다", "교사의 신체손해는 특약으로 보장한다", "재산손해도 보험금 지급 후 가입금액이 자동복원된다", "통상적인 경로의 등·하교 중 사고도 보상한다"], "a": 2, "e": "자동복원은 유아의 상해 의료비에 적용되고, 재산손해는 보험금을 지급한 만큼 가입금액이 감액됩니다. '자동복원'이라는 단어를 재산손해에 붙인 것이 함정입니다.", "p": "164~165쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-N14", "s": "nl", "q": "다음 중 동산종합보험에 가입할 수 있는 것은?", "o": ["자동차·선박·항공기", "수용장소가 특정되어 있는 상품", "동물과 식물", "리스전문업자의 리스물건"], "a": 3, "e": "공장 안에 장치된 기계는 제외되지만 리스전문업자의 리스물건은 가입할 수 있습니다. 자동차·선박·항공기, 장소가 특정된 상품, 동물·식물은 가입대상에서 제외됩니다.", "p": "166~167쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-N15", "s": "nl", "q": "장기화재보험의 자동복원제도에 대한 설명으로 맞는 것은?", "o": ["1회 사고 지급액이 가입금액의 50% 미만일 때만 복원된다", "보험금을 지급하면 지급한 만큼 가입금액이 감액된다", "80% 이상 지급으로 계약이 소멸돼도 만기환급금을 준다", "1회 사고 지급액이 가입금액의 80% 미만이면 가입금액이 줄지 않는다"], "a": 3, "e": "1회 사고로 지급한 보험금이 가입금액의 80% 미만이면 가입금액이 감액되지 않고 원래대로 복원됩니다. 80% 이상 지급으로 계약이 소멸하면 만기환급금은 지급하지 않습니다.", "p": "176~179쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-N16", "s": "nl", "q": "보험료 연체로 해지된 장기손해보험 계약의 부활에 대한 설명으로 틀린 것은?", "o": ["해지일로부터 3년 이내에 부활할 수 있다", "해약환급금을 받지 않은 경우에 가능하다", "연체보험료와 연체이자를 납입해야 한다", "부활할 때는 계약전 알릴의무를 다시 이행하지 않는다"], "a": 3, "e": "부활은 해약환급금을 받지 않은 계약에 한해 해지일로부터 3년 이내에 가능하며, 연체보험료·연체이자를 내고 계약전 알릴의무도 다시 이행해야 합니다.", "p": "180~181쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-N17", "s": "nl", "q": "장기손해보험 계약자가 약관을 받지 못해 계약을 취소한 경우 보험회사의 환급 방법으로 맞는 것은?", "o": ["납입보험료에 약관대출이율로 계산한 이자를 더해 돌려준다", "납입보험료만 이자 없이 돌려준다", "납입보험료에 정기예금이율로 계산한 이자를 더해 돌려준다", "납입보험료에 공시이율로 계산한 이자를 더해 돌려준다"], "a": 0, "e": "계약 취소 시 장기보험은 약관대출이율, 일반보험은 정기예금이율로 계산한 이자를 더해 돌려줍니다. (강의: 장기보험은 공시이율로 계산한 이자를 더해 반환)", "p": "88~89쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-N18", "s": "nl", "q": "연금저축보험의 세제적격 요건으로 틀린 것은?", "o": ["가입 연령에는 제한이 없다", "연간 1,800만 원 한도로 납입한다", "50세 이후부터 연금으로 수령해야 한다", "가입기간은 5년 이상이어야 한다"], "a": 2, "e": "연금 수령은 55세 이후, 가입일로부터 5년 이후, 연간 수령한도 이내여야 합니다. 55세를 50세로 바꾼 숫자 함정입니다.", "p": "198~199쪽", "tori": true, "src": "손해 책임으로 늦어진 기간에도 지연이자를 더해 지급한다", "청구가 있으면 추정 보험금의 50% 상당액을 가지급할 수 있다", "지급기일을 넘기면 약관대출이율을 연단위 복리로 더해 지급한다"], "a": 1, "e": "계약자·피보험자·수익자의 책임 있는 사유로 지급이 늦어진 기간에는 이자를 더하지 않습니다. 3영업일, 가지급 50%, 연단위 복리는 그대로 외워 두세요.", "p": "268~269쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T07", "s": "t3", "q": "상해사고의 요건에 대한 설명으로 맞는 것은?", "o": ["급격성은 결과 발생을 피할 수 없을 정도로 급박한 상태를 말한다", "우연성은 사고가 피보험자의 의사에 기인했음을 의미한다", "외래성은 사고 원인이 피보험자 신체에 내재된 것을 의미한다", "신체허약이나 질병도 급격하게 생기면 상해사고에 포함된다"], "a": 0, "e": "급격성의 정의가 맞습니다. 우연성은 의사에 기인하지 '않은' 것이고, 외래성은 원인이 외부에 있는 것이며, 신체허약·질병은 상해사고에서 배제됩니다.", "p": "272~273쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T08", "s": "t3", "q": "상해보험의 특징에 대한 설명으로 틀린 것은?", "o": ["사람의 신체가 보험의 목적이므로 보험가액 개념이 없다", "약정이 있으면 피보험자 권리를 해치지 않는 범위에서 대위할 수 있다", "계약자·피보험자·수익자의 중과실로 생긴 사고도 보상한다", "중복가입으로 비례보상할 때는 보험가액을 기준으로 한다"], "a": 3, "e": "상해보험에는 보험가액이 없으므로 회사의 보상한도액(보험가입금액)을 한도로 비례보상합니다. 사람이 대상인 보험은 고의만 면책이고 중과실은 보상한다는 점도 함께 기억하세요.", "p": "272~273쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T09", "s": "t3", "q": "상해보험의 보험료 산출에 대한 설명으로 맞는 것은?", "o": ["직업·직무의 위험도에 따라 5개 등급으로 구분한다", "항공기 정비공은 상해 3급의 예시 직업에 해당한다", "단체상해보험은 등급을 나누지 않고 단일률을 적용할 수 있다", "보험료 크기는 1급이 가장 크고 3급이 가장 작다"], "a": 2, "e": "교재는 단체상해보험이 등급 구분 없이 단일률을 산출해 적용할 수 있다고 적고 있습니다. 등급은 3개(1급 사무직, 2급 항공기 정비공, 3급 영업용 운전자)이고 보험료는 1급<2급<3급입니다. (강의: 쪽집게 모의고사 #1에서는 단체상해보험도 등급을 나눠 적용한다고 설명함)", "p": "274~275쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T10", "s": "t3", "q": "상해보험에서 보상하는 손해에 해당하는 것은?", "o": ["직무로 선박에 타는 선원이 직무상 탑승 중 입은 상해", "공용도로에서 자동차를 시운전하던 중 입은 상해", "동호회 활동으로 스쿠버다이빙을 하다가 입은 상해", "오토바이 경기를 위해 연습하던 중 입은 상해"], "a": 1, "e": "시운전 중 사고는 원칙적으로 면책이지만 공용도로상 시운전은 보상합니다. 직업·직무·동호회 목적의 스쿠버다이빙, 경기 연습, 선원의 직무상 탑승은 보상하지 않습니다.", "p": "276~277쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T11", "s": "t3", "q": "상해보험 후유장해보험금에 대한 설명으로 틀린 것은?", "o": ["장해지급률이 180일 내 확정되지 않으면 180일째 진단으로 정한다", "같은 신체부위에 장해가 2가지 이상이면 높은 지급률을 적용한다", "한시적 장해가 5년 이상이면 해당 장해지급률의 30%를 적용한다", "치료 과정에서 일시적으로 나타나는 증상은 장해에 포함되지 않는다"], "a": 2, "e": "치료 종결 후 한시적으로 나타나는 장해가 5년 이상이면 해당 장해지급률의 20%를 적용합니다. 20%를 30%로 바꾼 숫자 함정입니다.", "p": "278~279쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T12", "s": "t3", "q": "상해보험 정액 입원·수술급여금에 대한 설명으로 틀린 것은?", "o": ["다른 정액 계약이 있으면 계약별로 비례하여 나누어 지급한다", "상해입원일당 지급일수는 1회 입원당 180일을 한도로 한다", "입원 중 보험기간이 끝나도 퇴원 전까지 계속 입원분을 보상한다", "동일 상해로 동시에 2가지 이상 수술하면 1회에 한해 보상한다"], "a": 0, "e": "정액보상은 중복계약과 관계없이 보험금을 중복하여 지급합니다. 비례보상은 실손보상 담보에 적용되는 방식입니다.", "p": "280~281쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T13", "s": "t3", "q": "교통상해(운전자형·비운전자형)에서 보상하는 손해에 해당하는 것은?", "o": ["자동차를 정비·청소하는 작업을 하는 동안 발생한 손해", "화물을 싣고 내리는 하역작업을 하는 동안 발생한 손해", "건설기계를 작업기계로 사용하는 동안 발생한 손해", "운행 중인 시내버스에 승객으로 탑승 중 생긴 급격·우연한 사고"], "a": 3, "e": "운행 중인 교통수단에 탑승 중 생긴 사고는 교통상해로 보상합니다. 하역작업, 설치·수선·점검·정비·청소 작업, 건설·농업기계의 작업 사용 중 손해는 보상하지 않습니다.", "p": "280~281쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T14", "s": "t3", "q": "단체상해보험에 대한 설명으로 맞는 것은?", "o": ["1종 단체는 3인 이상의 근로자를 고용한 단체를 말한다", "변호사회·의사회 같은 동업자 단체는 2종(법정단체)에 해당한다", "타인 사망을 보험사고로 할 때 서면동의를 생략할 수 없다", "피보험자를 교체할 때 보험회사의 승낙은 필요하지 않다"], "a": 1, "e": "동업자 단체는 2종(법정단체)입니다. 1·2·3종 모두 5인 이상이 기준이고, 단체상해보험은 서면동의를 생략할 수 있으며, 피보험자 변경에는 피보험자 동의와 보험회사 승낙이 필요합니다.", "p": "282~283쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T15", "s": "t3", "q": "보험계약일이 2026년 9월 1일이고 피보험자 생년월일이 1990년 2월 1일일 때 보험나이는?", "o": ["34세", "35세", "36세", "37세"], "a": 3, "fixed": true, "e": "만 36년 7개월이고 6개월 이상은 1년으로 올리므로 보험나이는 37세입니다. 6개월 미만이면 버린다는 기준과 헷갈리지 마세요.", "p": "288~289쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T16", "s": "t3", "q": "암보험의 대기기간에 대한 설명으로 틀린 것은?", "o": ["15세 미만자도 암보험에 90일 대기기간을 똑같이 설정한다", "대기기간 중 암 진단이 확정되면 암 특약은 무효가 된다", "특약이 무효가 되면 이미 납입한 특약보험료를 돌려준다", "제자리암·갑상선암 등은 대기기간 없이 보험기간 시작일부터 보상한다"], "a": 0, "e": "2006년 1월 1일부터 15세 미만자는 암보험에 대기기간을 설정하지 않습니다. 대기기간은 역선택을 막기 위해 둔다는 점도 함께 기억하세요.", "p": "288~289쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T17", "s": "t3", "q": "다음 괄호에 들어갈 내용이 순서대로 나열된 것은?\n\"CI보험은 잔여수명이 ( ㉠ ) 이하인 치명적 질병이 발생하면 사망보험금의 ( ㉡ )를 선지급한다.\"", "o": ["3개월, 30%", "3개월, 50%", "6개월, 30%", "6개월, 50%"], "a": 3, "fixed": true, "e": "CI보험은 잔여수명 6개월 이하일 때 사망보험금의 50%를 선지급하고, 보험료 납입면제 제도도 운영합니다.", "p": "294~295쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T18", "s": "t3", "q": "질병사망보험의 특수성에 대한 설명으로 틀린 것은?", "o": ["15세 미만자를 피보험자로 한 질병사망 계약은 무효이다", "계약 체결 전에 보험사고가 이미 확정된 계약은 무효이다", "질병사망은 기본계약의 보통약관으로도 운영할 수 있다", "보험수익자가 없으면 피보험자의 상속인에게 보험금을 지급한다"], "a": 2, "e": "질병사망보험은 특별약관으로만 운영할 수 있고 기본계약(보통약관)으로는 운영할 수 없습니다. 심신박약자가 계약자이거나 단체보험 피보험자로서 의사능력이 있으면 유효라는 예외도 있습니다.", "p": "286~287쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T19", "s": "t3", "q": "장기요양등급에 대한 설명으로 맞는 것은?", "o": ["장기요양등급은 보험회사가 자체 기준으로 판정한다", "5등급이 일상생활에서 전적으로 도움이 필요한 상태이다", "1등급의 장기요양 인정점수는 75점 이상 95점 미만이다", "1~5등급과 인지지원등급으로 구분하며 1등급이 가장 심하다"], "a": 3, "e": "장기요양등급은 1~5등급과 인지지원등급으로 나뉘고 1등급(95점 이상)이 가장 심합니다. 판정은 국민건강보험공단 장기요양등급판정위원회가 합니다.", "p": "300~301쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T20", "s": "t3", "q": "치매 보장에 대한 설명으로 틀린 것은?", "o": ["중증치매의 예시 기준은 CDR 척도 3~5점이다", "경증치매 진단보험금은 중증치매 진단보험금보다 높게 설계된다", "경증치매의 예시 기준은 장기요양등급 3~4등급이다", "중증치매가 일정기간(예: 90일) 이상 계속되면 간병비를 지급한다"], "a": 1, "e": "경증치매 진단보험금은 중증치매보다 낮게 설계됩니다. 중증은 장기요양 1~2등급 또는 CDR 3~5점, 경증은 3~4등급 또는 CDR 1~2점이 예시 기준입니다.", "p": "300~303쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T21", "s": "t3", "q": "보험금 대리청구인 지정제도에 대한 설명으로 맞는 것은?", "o": ["보험사고가 발생한 뒤에만 대리청구인을 지정할 수 있다", "계약자·피보험자·수익자가 같은 계약에서 지정을 신청할 수 있다", "계약자와 피보험자가 다른 계약에서만 지정할 수 있다", "대리청구인은 보험회사가 직권으로 지정한다"], "a": 1, "e": "본인을 위한 계약(계약자=피보험자=보험수익자)에서 보험회사에 신청해 지정합니다. 가입 초기나 유지 중에 미리 지정해 두는 제도입니다.", "p": "302~303쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T22", "s": "t3", "q": "장기간병보험에서 보상하는 경우에 해당하는 것은?", "o": ["알코올중독으로 인해 간병이 필요한 상태가 된 경우", "환각제를 복용하여 간병이 필요한 상태가 된 경우", "계약자가 고의로 피보험자를 해쳐 간병상태가 된 경우", "청약 전 진단된 질병이 5년간 추가 치료 없이 지난 뒤 생긴 간병상태"], "a": 3, "e": "고지대상 질병이라도 청약일 후 5년간 추가 진단(단순 건  "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T28", "s": "t3", "q": "다음 괄호에 들어갈 금액으로 알맞은 것은?\n\"기본형 입원 급여의료비의 자기부담금(20%)이 계약일 또는 매년 계약해당일부터 연간 (    )을 초과하면 그 초과금액은 한도 내에서 보상한다.\"", "o": ["200만원", "300만원", "500만원", "1,000만원"], "a": 0, "fixed": true, "e": "기본형 급여 입원 자기부담금은 연간 200만원까지만 부과하고, 넘는 금액은 보상합니다. 500만원은 특약1의 (상급)종합병원 입원 자기부담금 공제한도입니다.", "p": "326~327쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T29", "s": "t3", "q": "5세대 실손 특별약관1(중증 비급여)에 대한 설명으로 틀린 것은?", "o": ["암·뇌혈관·심장질환 등 산정특례 대상질환의 비급여를 보장한다", "입원 자기부담금은 비급여의료비(비급여병실료 제외)의 30%이다", "통원 자기부담금은 보장대상의료비 50%와 5만원 중 큰 금액이다", "상급종합·종합병원 입원 시 자기부담금 공제한도는 500만원이다"], "a": 2, "e": "특약1 통원 자기부담금은 보장대상의료비 30%와 3만원 중 큰 금액입니다. 50%·5만원은 특약2 기준이니 특약1·2 숫자를 짝지어 외우세요.", "p": "314~315쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T30", "s": "t3", "q": "5세대 실손 특별약관1의 3대 비급여 연간 보상한도로 맞게 연결된 것은?", "o": ["근골격계 이학요법·체외충격파 – 연간 250만원(30회)", "주사료 – 연간 250만원(50회)", "자기공명영상진단 – 연간 350만원", "근골격계 이학요법·체외충격파 – 연간 300만원(50회)"], "a": 1, "e": "3대 비급여 한도는 이학요법·체외충격파 연간 350만원(50회), 주사료 연간 250만원(50회), MRI 연간 300만원입니다. 숫자를 서로 바꿔 넣은 보기가 함정입니다.", "p": "314~315쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T31", "s": "t3", "q": "5세대 실손 특별약관1의 3대 비급여에 대한 설명으로 틀린 것은?", "o": ["이학요법·체외충격파는 횟수를 합산하여 최초 10회를 보장한다", "증상 개선이 확인되면 10회 단위로 연간 50회까지 보상한다", "항암제 주사료도 3대 비급여 주사료 한도(250만원) 안에서 보상한다", "도수치료·증식치료는 근골격계 이학요법치료의 예시에 해당한다"], "a": 2, "e": "항암제·항생제(항진균제 포함)·희귀의약품 주사료는 3대 비급여 주사료가 아니라 상해·질병비급여에서 보상합니다.", "p": "314~315쪽, 334~335쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T32", "s": "t3", "q": "5세대 실손 특별약관2(비중증 비급여)에 대한 설명으로 틀린 것은?", "o": ["상해·질병비급여는 각각 입·통원 합산 연간 5천만원 한도이다", "입원은 병·의원 회당 300만원 한도가 적용된다", "비급여 자기공명영상진단은 연간 200만원 한도로 보상한다", "입원 자기부담금은 비급여의료비의 50%에 해당하는 금액이다"], "a": 0, "e": "특약2는 상해·질병비급여 각각 입·통원 합산 연간 1천만원 한도이고, 통원은 일당 20만원, 자기부담은 50%(통원은 5만원과 50% 중 큰 금액)입니다. (강의: 4세대 기준으로 비급여 특약 자기부담을 30%·3만원으로 설명함. 5세대 특약2는 50%·5만원)", "p": "314~315쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T33", "s": "t3", "q": "다음 괄호에 들어갈 내용이 순서대로 나열된 것은?\n\"특별약관1·2에서 상급병실료 차액은 비급여병실료의 ( ㉠ )를 보상하되, 1일 평균금액 ( ㉡ )을 한도로 한다.\"", "o": ["30%, 5만원", "50%, 5만원", "50%, 10만원", "70%, 10만원"], "a": 2, "fixed": true, "e": "상급병실료 차액은 비급여병실료의 50%를 보상하고 1일 평균금액 10만원이 한도입니다. 1일 평균금액은 입원기간 비급여병실료 전체를 총 입원일수로 나누어 구합니다.", "p": "328~329쪽, 348~349쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T34", "s": "t3", "q": "5세대 실손 기본형에서 보험계약 종료 후 보상에 대한 설명으로 틀린 것은?", "o": ["입원 중 계약이 끝나면 종료일 다음 날부터 180일까지 보상한다", "통원 중 계약이 끝나면 180일 이내 통원을 최대 90회까지 보상한다", "계속 중인 치료는 연간 한도에서 이미 지급한 금액을 뺀 잔액이 한도이다", "같은 회사 상품에 재가입해도 종료 후 180일 추가보상이 적용된다"], "a": 3, "e": "자동갱신하거나 같은 회사 상품에 재가입하면 종전 보험기간을 연장하는 것으로 보아 종료 후 추가보상 규정을 적용하지 않습니다. 참고로 특약2는 통원 '최대 90일'로 적혀 있습니다.", "p": "318~319쪽, 326~327쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T35", "s": "t3", "q": "실손의료보험 관련 용어에 대한 설명으로 맞는 것은?", "o": ["노인요양원·복지시설도 의료기관과 동등한 곳으로 인정된다", "입원은 의료기관에 6시간 이상 머물며 의사 관리하에 치료받는 것이다", "약국에는 의료기관 안의 조제실도 포함된다", "다수보험에는 공제·제3보험 등 실손 보상 계약이 포함되지 않는다"], "a": 1, "e": "입원은 계속하여 6시간 이상 체류하며 의사의 관찰·관리하에 치료받는 것입니다. 요양원·복지시설은 의료기관이 아니고, 약국에서 의료기관 조제실은 제외하며, 다수보험에는 공제·제3보험 등이 포함됩니다.", "p": "378~379쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T36", "s": "t3", "q": "5세대 실손 특별약관2의 보험료 할인·할증(요율상대도)에 대한 설명으로 맞는 것은?", "o": ["할증은 특약2 보험금 지급실적이 연간 100만원 이상인 계약에만 적용한다", "요율상대도는 특약1과 특약2의 보험금 실적을 합산하여 적용한다", "장기요양 1·2등급 판정자의 비급여의료비도 지급실적에 포함한다", "지급실적은 갱신 직전 3년간의 보험금을 기준으로 산정한다"], "a": 0, "e": "할증은 특약2 지급실적이 연간 100만원 이상인 계약에만 적용하고, 실적은 갱신시점 3개월 전 말일부터 직전 12개월로 봅니다. 장기요양 1·2등급 판정자의 비급여의료비는 실적에서 제외합니다. (강의: 4세대 기준으로 비급여 전체에 차등을 두고 산정특례 대상자·장기요양 1~2등급을 제외한다고 설명함)", "p": "368~369쪽", "tori": true, "src": "손해보험협회 연수교재(2026)"}, {"id": "T-T37", "s": "t3", "q": "실손의료보험의 갱신·재가입 주기에 대한 설명으로 맞는 것은?", "o": ["노후실손은 보험료를 1년마다 갱신하고 5년 후 재가입한다", "유병력자실손은 보험료를 3년마다 갱신하고 3년 후 재가입한다", "5세대 실손은 보험료를 1년마다 갱신하고 5년 후 재가입한다", "5세대 실손은 보험료를 3년마다 갱신하고 15년 후 재가입한다"], "a": 2, "e": "갱신은 세 상품 모두 1년마다이고, 재가입은 5세대 실손 5년, 노후·유병력자실손 3년입니다.", "p": "374~37 , "fam": "E-t3-30", "s": "t3", "q": "장기간병보험에 대한 설명으로 틀린 것은?", "o": ["일상생활장애·치매상태 진단 시 간병비를 지급한다", "간병비는 연금이나 일시금 형태로 지급한다", "장기손해보험상품에 해당한다", "질병으로 인한 간병상태만 보장한다"], "a": 3, "e": "장기간병보험은 상해·질병 등의 사고로 일상생활장애상태나 치매상태가 된 경우를 보장합니다. 상해로 인한 간병상태도 보장 대상입니다.", "p": "300~301쪽", "tori": true, "src": "손해보험협회 연수교재(2026) · 실전 난이도 기본 문제"}, {"id": "E-t3-31", "fam": "E-t3-31", "s": "t3", "q": "장기간병보험의 장기요양급여금 지급에 대한 설명으로 맞는 것은?", "o": ["보험회사가 자체 기준으로 장기요양등급을 판정한다", "모든 상품이 1~5등급을 똑같이 보상한다", "상품마다 보상하는 등급 범위가 다르다", "보험금은 일시지급형으로만 지급한다"], "a": 2, "e": "국민건강보험공단 장기요양등급판정위원회의 등급 판정을 받은 경우 지급하며, 보상하는 등급 범위는 상품마다 다릅니다. 지급 방식도 일시지급형·매월지급형 등이 있습니다.", "p": "300~301쪽", "tori": true, "src": "손해보험협회 연수교재(2026) · 실전 난이도 기본 문제"}, {"id": "E-t3-32", "fam": "E-t3-32", "s": "t3", "q": "치매 관련 전문의가 전반적인 인지기능과 사회기능 정도를 측정하는 검사는?", "o": ["장기요양 인정점수", "CDR 척도", "장해분류표", "한국표준질병·사인분류"], "a": 1, "e": "CDR(Clinical Dementia Rating) 척도입니다. 예시 기준으로 중증치매는 CDR 3~5점, 경증치매는 1~2점입니다.", "p": "302~303쪽", "tori": true, "src": "손해보험협회 연수교재(2026) · 실전 난이도 기본 문제"}, {"id": "E-t3-33", "fam": "E-t3-33", "s": "t3", "q": "치매 등으로 본인이 직접 보험금을 청구하기 어려운 경우에 대비해, 대신 청구할 사람을 미리 지정해 두는 제도는?", "o": ["보험금 가지급제도", "보험료 납입면제제도", "보험금 대리청구인 지정제도", "태아가입특별약관"], "a": 2, "e": "보험금 대리청구인 지정제도입니다. 계약자·피보험자·보험수익자가 같은 '본인을 위한 계약'에서 신청할 수 있습니다.", "p": "302~303쪽", "tori": true, "src": "손해보험협회 연수교재(2026) · 실전 난이도 기본 문제"}, {"id": "E-t3-34", "fam": "E-t3-34", "s": "t3", "q": "질병·상해로 입원·통원 치료를 받거나 처방조제를 받은 경우 본인이 실제로 부담한 의료비를 보상하는 상품은?", "o": ["CI보험", "실손의료보험", "암보험", "장기간병보험"], "a": 1, "e": "실손의료보험입니다. 요양급여·의료급여 중 본인부담금과 비급여의 합계액에서 약관상 자기부담금을 뺀 금액을 보상합니다.", "p": "312~313쪽", "tori": true, "src": "손해보험협회 연수교재(2026) · 실전 난이도 기본 문제"}, {"id": "E-t3-35", "fam": "E-t3-35", "s": "t3", "q": "실손의료보험의 종류에 대한 설명으로 틀린 것은?", "o": ["유병력자실손은 가입심사 요건을 강화한 상품이다", "판매시기 등에 따라 1~5세대와 기타 실손으로 나뉜다", "노후실손은 자기부담금을 높게 설정한 상품이다", "노후·유병력자실손은 기타 실손으로 구분한다"], "a": 0, "e": "유병력자실손은 계약전 알릴의무사항 등 가입심사 요건을 축소해 일부 유병력자도 가입하기 쉽게 설계한 상품입니다. 노후실손은 자기부담금(공제금액)을 높게 설정한 상품입니다.", "p": function renderNotes(){
  const N=NOTES[S.exam], ex=SET();
  const tab=S.noteTab||'groups';
  const flagChip=(f,d)=> f==='diff' ? `<span class="flag diff">${N.otherShort}와 다름</span>` : f==='ok' ? `<span class="flag ok">${N.otherShort}와 같음</span>` : '';
  let body='';
  if(tab==='groups') body = N.groups.map(g=>`<section class="ngroup"><h3>${esc(g.t)}</h3><dl>${g.items.map(([k,v])=>`<div class="nrow"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></section>`).join('');
  if(tab==='nums') body = `<section class="ngroup"><dl>${N.nums.map(([k,v,f,d])=>`<div class="nrow num"><dt>${esc(k)}</dt><dd><b class="tnum">${esc(v)}</b>${flagChip(f)}${f==='diff'?`<span class="dnote">${esc(N.otherShort)}: ${esc(d)}</span>`:''}</dd></div>`).join('')}</dl></section>`;
  if(tab==='traps') body = `<section class="ngroup"><ul class="traps">${N.traps.map(([a,b])=>`<li><span class="x">${esc(a)}</span><span class="o">${esc(b)}</span></li>`).join('')}</ul></section>`;
  if(tab==='top') body = `<section class="ngroup"><ol class="topl">${N.top.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></section>`;
  const diffs=N.nums.filter(r=>r[2]==='diff').length;
  app.innerHTML = `
  <div class="topbar"><button class="x" id="bBack">← 돌아가기</button><span class="pos">${ex.name} 핵심노트</span></div>
  <header class="nhead">
    <h2>${ex.name} 핵심노트</h2>
    <p class="muted">기준: ${esc(N.basis)}</p>
    <p class="muted">대조: ${esc(N.other)} · 다른 곳 ${diffs}군데 표시</p>
  </header>
  <div class="seg" role="tablist">
    ${[['groups','핵심 개념'],['nums','숫자 암기'],['traps','함정 체크'],['top','강조 Top 10']].map(([k,t])=>`<button role="tab" aria-selected="${k===tab}" data-nt="${k}">${t}</button>`).join('')}
  </div>
  ${tab==='traps'?`<p class="muted hint">왼쪽은 시험에 자주 나오는 틀린 보기, 오른쪽이 바른 내용입니다.</p>`:''}
  ${body}
  <p class="muted foot">강의 내용은 자동 생성 자막을 바탕으로 요약했습니다. 숫자는 시험 전에 공식 교재로 한 번 더 확인하세요.</p>`;
  document.getElementById('bBack').onclick=()=>{ S.view='home'; render(); window.scrollTo(0,0); };
  app.querySelectorAll('[data-nt]').forEach(b=>b.onclick=()=>{ S.noteTab=b.dataset.nt; renderNotes(); });
}

const CORE_META = { note:'2026년 8~10월 실전 문제와 김토리쌤 2026 강의·모의고사에 반복해 나온 단골 개념만 모았습니다. 10월 실전을 빼고 고른 목록으로 10월 50문항 중 38문항(76%)을 풀 수 있었습니다.' };
const coreKey = 'omr.core2';
const coreSecs = () => S.exam==='nonlife' ? ['nl','cm','t3'] : S.exam==='third' ? ['cm','t3'] : [];
const coreList = () => coreSecs().flatMap(s => (CORE[s]||[]).map(x=>({...x, s, k:s+'|'+x.c}))).filter(c=>c.ids.some(id=>byId(id)));
const SEC_SHORT = {nl:'손해', cm:'공통', t3:'제3보험'};
function buildCore(n=20){
  const prog=store.get(coreKey,{}), list=coreList(), st=c=>prog[c.k]||{s:0,n:0};
  const todo=list.filter(c=>st(c).s<2);
  let order;
  if(todo.length){
    const missed=shuffle(todo.filter(c=>st(c).n>0&&st(c).s===0)), fresh=shuffle(todo.filter(c=>st(c).n===0)), once=shuffle(todo.filter(c=>st(c).s===1));
    /* 세트마다 틀린 개념 최대 5개 + 한 번 맞힌 개념 최대 7개(졸업 확인) + 처음 보는 개념 8개 이상 */
    order=[...missed.slice(0,5), ...once.slice(0,7), ...fresh, ...missed.slice(5), ...once.slice(7)];
  } else order=shuffle(list);
  return shuffle(order.slice(0,n)).map(c=>{ const ids=c.ids.filter(id=>byId(id)); const q=instantiate(byId(ids[st(c).n % ids.length])); q.core=c.k; q.key=c.key; q.cname=c.c; return q; });
}
function coreMark(k, ok){
  const prog=store.get(coreKey,{}), cur=prog[k]||{s:0,n:0}, was=cur.s;
  prog[k]={s: ok ? Math.min(cur.s+1,2) : 0, n: cur.n+1};
  store.set(coreKey, prog);
  return was<2 && prog[k].s===2;
}
/* 실전 모의고사에서 틀린 문제가 핵심 개념이면 그 개념을 다시 반복 목록으로 */
function coreReopen(wrongIds){
  const prog=store.get(coreKey,{}); let hit=0;
  ['nl','cm','t3'].forEach(s=>(CORE[s]||[]).forEach(c=>{ if(c.ids.some(id=>wrongIds.includes(id))){ const k=s+'|'+c.c; const cur=prog[k]||{s:0,n:0}; prog[k]={s:0,n:Math.max(cur.n,1)}; hit++; } }));
  if(hit) store.set(coreKey, prog);

    take([...fresh(2), ...fresh(1), ...(mix[2]>0.3?fresh(3):[])], n);
    if(chosen.length<n) take(rank(all.filter(b=>dOf(b)<3)), n);
    if(chosen.length<n) take(rank(all), n);
    if(chosen.length<n) for(const b of shuffle(all)){ if(chosen.length>=n) break; if(!chosen.includes(b)) chosen.push(b); }
    shuffle(chosen).forEach(b=>out.push(instantiate(b)));
  });
  const ids=out.map(q=>q.id), keep=Math.floor(ex.pool.length*0.6);
  store.set(sKey(), [...ids, ...[...seen].filter(id=>!ids.includes(id))].slice(0,keep));
  return out;
}
function start(mode, onlyWrong){
  if(onlyWrong){ const ids=store.get(wKey(),[]).filter(byId); if(!ids.length) return; S.list=shuffle(ids).map(id=>instantiate(byId(id))); }
  else S.list = mode==='core' ? buildCore() : buildSet();
  S.grad=0; S.retry=!!onlyWrong; S.mode=mode; S.idx=0; S.ans={}; S.locked={}; S.confirm=false; S.view='quiz';
  clearInterval(S.timerId);
  if(mode==='exam'){ S.t = SET().time ? SET().time*60 : 0; S.timerId=setInterval(tick,1000); }
  render(); window.scrollTo(0,0);
}
function tick(){
  const down=!!SET().time;
  S.t += down ? -1 : 1;
  if(down && S.t<=0){ clearInterval(S.timerId); finish(); return; }
  const el=document.getElementById('timer'); if(el){ el.textContent=timerText(); el.classList.toggle('low',down&&S.t<300); }
}
const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const timerText = () => SET().time ? fmt(S.t) : '경과 '+fmt(S.t);
function pick(i){
  const k=S.idx, q=S.list[k];
  if((S.mode==='practice'||S.mode==='core') && S.locked[k]) return;
  S.ans[k]=i;
  if(S.mode==='practice'||S.mode==='core'){ S.locked[k]=true; recordWrong(q.id, i!==q.a); }
  if(S.mode==='core' && q.core && coreMark(q.core, i===q.a)) S.grad++;
  render();
}
function recordWrong(id, isWrong){
  const w=new Set(store.get(wKey(),[]));
  if(isWrong) w.add(id); else w.delete(id);
  store.set(wKey(),[...w].sort());
}
function go(d){ S.idx=Math.min(S.list.length-1,Math.max(0,S.idx+d)); S.confirm=false; render(); window.scrollTo(0,0); }
function jump(i){ S.idx=i; S.confirm=false; render(); window.scrollTo(0,0); }
function finish(){
  clearInterval(S.timerId);
  if(S.mode==='exam'){ const miss=S.list.filter((q,k)=>S.ans[k]!==q.a).map(q=>q.id); S.list.forEach((q,k)=>recordWrong(q.id, S.ans[k]!==q.a)); coreReopen(miss); if(!S.retry) store.set(mKey(), miss); }
  const r=calc();
  if(!S.retry && S.mode==='exam'){ const h=store.get('omr.hist.'+S.exam,[]); h.push(r.dual ? r.parts.map(x=>x.score) : [r.total]); store.set('omr.hist.'+S.exam, h.slice(-8)); }
  if(!S.retry && S.mode!=='core'){ const b=store.get(bKey(),null); if(b===null||r.total>b) store.set(bKey(),r.total); }
  S.view='result'; render(); window.scrollTo(0,0);
}
function calc(){
  const by={}; let right=0, pts=0, maxPts=0;
  S.list.forEach((q,k)=>{ const pt=SEC[q.s].pt; by[q.s]=by[q.s]||[0,0]; by[q.s][1]+=1; maxPts+=pt; if(S.ans[k]===q.a){ by[q.s][0]+=1; right++; pts+=pt; } });
  const ex=SET(), equal = ex.scoring!=='points';
  if(ex.dual){ /* 손해보험(1~33번)·제3보험(18~50번)을 따로 100점 환산, 둘 다 60점 이상이어야 합격 */
    const parts=ex.dual.map(d=>{ let r=0,n=0; d.secs.forEach(sc=>{ if(by[sc]){ r+=by[sc][0]; n+=by[sc][1]; } }); return {...d, right:r, n, score: n?Math.round(r/n*100):0}; });
    return {by, parts, total: Math.min(...parts.map(x=>x.score)), max:100, right, n:S.list.length, equal:true, dual:true}; }
  return {by, total: equal ? Math.round(right/S.list.length*100) : pts, max: equal ? 100 : maxPts, right, n:S.list.length, equal};
}

    <div class="breakdown"><div><b class="tnum">${S.grad}개</b><span>이번에 졸업한 개념</span></div><div><b class="tnum">${done} / ${list.length}</b><span>전체 졸업 진행</span></div></div>
  </section>
  <div class="gradnote">${done===list.length?'핵심 개념을 모두 졸업했습니다. 이제 실전 모의고사(50문항)로 처음 보는 문제를 풀어 과목별 75점 이상이 2~3번 나오는지 확인해 보세요.':'틀린 개념은 다음 세트에 먼저 나오고, 두 번 연속 맞히면 졸업합니다. 남은 개념 '+(list.length-done)+'개를 계속 반복하세요.'}</div>
  <div class="sheet-foot" style="padding:16px 0 0">
    <button class="btn" id="bNext20">다음 20문항</button>
    <button class="btn ghost" id="bHome">처음으로</button>
  </div>
  ${wrongs.length?`<h3 style="margin-top:32px;font-size:17px">틀린 개념 다시 보기</h3>
  <div class="review">${wrongs.map(([q,k])=>{ const c=S.ans[k]; return `<div class="rv">
    <div class="t">${esc(q.q)}</div>
    <div class="a">내 답 ${c===undefined?'미표기':NUM[c]} · 정답 <b>${NUM[q.a]} ${esc(q.o[q.a])}</b></div>
    ${q.key?`<div class="keyline" style="margin-top:10px"><b>핵심</b>${esc(q.key)}</div>`:''}
    <p>${esc(q.e)}</p><p class="rvsrc">근거: ${esc(q.src||SET().src)} ${esc(q.p)}</p></div>`; }).join('')}</div>`
  :`<div class="note" style="border-color:var(--ok)"><b>모두 맞혔습니다</b>이번 세트 개념은 한 단계씩 졸업에 가까워졌습니다.</div>`}`;
  document.getElementById('bHome').onclick=()=>{ S.view='home'; render(); window.scrollTo(0,0); };
  document.getElementById('bNext20').onclick=()=>start('core');
}
function renderResult(){
  if(S.mode==='core') return renderCoreResult();
  const r=calc(), full=!S.retry, pass=full && r.total>=60;
  const wrongs=S.list.map((q,k)=>[q,k]).filter(([q,k])=>S.ans[k]!==q.a);
  const timeNote = S.mode==='exam' && !SET().time ? ` · 걸린 시간 ${fmt(S.t)}` : '';
  app.innerHTML = `
  <header class="brand"><h1>채점 결과</h1><div class="ed">${SET().name} · ${S.mode==='exam'?'실전 모드':'연습 모드'}${timeNote}</div></header>
  <section class="score">
    ${r.dual ? `<div class="duo">${r.parts.map(x=>`<div class="duo-i ${x.score>=60?'ok':'no'}"><span>${x.name} <small>${x.range}</small></span><b class="tnum">${x.score}<small>점</small></b><em>${x.right} / ${x.n}문항</em></div>`).join('')}</div>` : `<div class="big tnum">${r.total}<small>/ ${r.max}점</small></div>`}
    ${full?`<div class="pass ${pass?'ok':'no'}">${pass?'합격':'불합격'}</div>`:`<div class="muted" style="font-size:14px">오답 복습 점수</div>`}
    <div class="breakdown">
      ${Object.entries(r.by).map(([s,v])=>`<div><b class="tnum">${v[0]} / ${v[1]}문항</b><span>${SEC[s].name}</span></div>`).join('')}
    </div>
  </section>
  <p class="muted" style="font-size:14px;margin:12px 2px 0">${!full?'틀린 문제만 다시 푼 결과라 합격 여부는 표시하지 않습니다.':(r.dual?`손해보험(1~33번)과 제3보험(18~50번)을 각각 100점으로 환산했습니다. 두 과목 모두 60점 이상이어야 합격이고, 18~33번은 두 과목에 모두 들어갑니다.`:r.equal?`${r.n}문항 중 ${r.right}문항을 맞혀 100점으로 환산했습니다. 60점 이상이면 합격입니다.`:'실제 시험은 100점 만점에 60점 이상이면 합격입니다.')}</p>
  <div class="sheet-foot" style="padding:16px 0 0">
    <button class="btn" id="bHome">처음으로</button>
    <button class="btn ghost" id="bAgain">새 시험지로 다시</button>
    ${wrongs.length?`<button class="btn red" id="bRetry">틀린 ${wrongs.length}문항 다시 풀기</button>`:''}
  </div>
  ${wrongs.length?`<h3 style="margin-top:32px;font-size:17px">틀린 문제 해설</h3>
  <div class="review">${wrongs.map(([q,k])=>{ const c=S.ans[k]; return `<div class="rv">
    <div class="t"><span class="tnum" style="color:var(--omr)">${k+1}.</span> ${esc(q.q)}</div>
    <div class="a">내 답 ${c===undefined?'미표기':NUM[c]} · 정답 <b>${NUM[q.a]} ${esc(q.o[q.a])}</b></div>
    ${coreOf(q.id)?`<div class="keyline"><b>핵심</b>${esc(coreOf(q.id).key)}</div>`:''}
    <p>${esc(q.e)}</p><p class="rvsrc">근거: ${esc(q.src||SET().src)} ${esc(q.p)}</p></div>`; }).join('')}</div>`
  :`<div class="note" style="border-color:var(--ok)"><b>모두 맞혔습니다</b>오답노트에서 이번에 맞힌 문제는 지웠습니다.</div>`}`;
  document.getElementById('bHome').onclick=()=>{ S.view='home'; render(); window.scrollTo(0,0); };
  document.getElementById('bAgain').onclick=()=>start(S.mode);
  const rt=document.getElementById('bRetry'); if(rt) rt.onclick=()=>{ const ids=wrongs.map(([q])=>q.id); store.set(wKey(),[...new Set([...store.get(wKey(),[]),...ids])]); start('practice',true); };
}
render();


</script>
